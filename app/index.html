/* ---------------- 渲染：题库 ---------------- */
function renderBank(){
  var el = $('#view-bank');
  var qs = allQuestions();
  var f = Store.filter.bank;
  var subj = Store.filter.subject || 'all';        // all / en1 / en2
  var list = qs.filter(function(q){
    if(subj !== 'all' && subjOf(q) !== subj) return false;
    if(f === 'all') return true;
    if(f === 'practiced') return practiceStats(q.id).total > 0;
    if(f === 'unpracticed') return practiceStats(q.id).total === 0;
    if(f === 'real' || f === 'mock' || f === 'mine') return catOf(q) === f;
    return q.kind === f;
  });
  var counts = { real:0, mock:0, mine:0, practiced:0, total:qs.length, en1:0, en2:0 };
  qs.forEach(function(q){
    counts[catOf(q)]++;
    counts[subjOf(q)]++;
    if(practiceStats(q.id).total > 0) counts.practiced++;
  });

  var h = '<div class="card"><h2>题库</h2>'
    + '<div class="hint">题库分三级查看：<b>科目</b>（英语一 / 英语二）→ <b>三类</b>（考研真题 / 模拟题 / 我的题目）→ 题型。'
    + '真题按年份收录，模拟题由 AI 原创并配内嵌 SVG 示意图。'
    + '点开任意一道题，能看到它<b>是否练过、练过几次、每次的作文与得分</b>。</div>'
    + '<div class="catgrid">'
    +   '<div class="catsum">英语一 <b>' + counts.en1 + '</b> 道</div>'
    +   '<div class="catsum">英语二 <b>' + counts.en2 + '</b> 道</div>'
    +   '<div class="catsum">考研真题 <b>' + counts.real + '</b> 道</div>'
    +   '<div class="catsum">模拟题 <b>' + counts.mock + '</b> 道</div>'
    +   '<div class="catsum">我的题目 <b>' + counts.mine + '</b> 道</div>'
    +   '<div class="catsum">已练习过 <b>' + counts.practiced + '</b> / ' + counts.total + ' 道</div>'
    + '</div>'
    + '<div class="row" style="margin-top:12px"><span class="isub" style="margin-right:4px">科目</span>';
  [['all','全部'],['en1','英语一'],['en2','英语二']].forEach(function(x){
    h += '<button class="btn'+(subj===x[0]?' primary':'')+'" data-subjfilter="'+x[0]+'">'+x[1]+'</button>';
  });
  h += '</div><div class="row" style="margin-top:8px"><span class="isub" style="margin-right:4px">类别</span>';
  [['all','全部'],['real','考研真题'],['mock','模拟题'],['mine','我的题目'],['practiced','练过的'],['unpracticed','没练过的']].forEach(function(x){
    h += '<button class="btn'+(f===x[0]?' primary':'')+'" data-qfilter="'+x[0]+'">'+x[1]+'</button>';
  });
  h += '</div><div class="row" style="margin-top:8px"><span class="isub" style="margin-right:4px">题型</span>';
  [['major','大作文'],['minor','小作文'],['translation','翻译'],['drill','长难句专项']].forEach(function(x){
    h += '<button class="btn'+(f===x[0]?' primary':'')+'" data-qfilter="'+x[0]+'">'+x[1]+'</button>';
  });
  h += '<span class="spacer"></span><span class="isub">显示 '+list.length+' 题</span></div></div>';

  // 一键更新题库（放在题库顶部，便于每年更新一次）
  h += bankErrorBanner();
  h += updatePanelHtml();

  if(!list.length) h += '<div class="card"><div class="empty">没有符合条件的题目。' +
    (f==='mine' ? '到「提交作文 → 上传自己的题目」添加一道。' : '') + '</div></div>';
  list.forEach(function(q){
    var open = !!Store.open['q_'+q.id];
    var st = practiceStats(q.id);
    h += '<div class="item"><div class="ihead" data-toggle="q_'+esc(q.id)+'">'
       + '<span class="caret">'+(open?'▾':'▸')+'</span>'
       + '<span class="ititle">'+esc(q.title)+'</span>'
       + subjPill(q)
       + catPill(q)
       + '<span class="pill '+KIND_CLASS[q.kind]+'">'+esc(kindLabel(q))+'</span>'
       + practiceBadge(q.id)
       + '<span class="spacer"></span><span class="isub">'+esc(q.source||'')+'</span></div>';
    if(open) h += '<div class="ibody">'+renderQuestionBody(q, false)+'</div>';
    h += '</div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-qfilter]').forEach(function(b){
    b.addEventListener('click', function(){ Store.filter.bank = b.getAttribute('data-qfilter'); render(); });
  });
  el.querySelectorAll('[data-subjfilter]').forEach(function(b){
    b.addEventListener('click', function(){ Store.filter.subject = b.getAttribute('data-subjfilter'); render(); });
  });
  bindItems(el);
  el.querySelectorAll('[data-pick]').forEach(function(b){
    b.addEventListener('click', function(){
      Store.draftQuestionId = b.getAttribute('data-pick'); switchView('submit');
      toast('已选择该题，去粘贴作文吧');
    });
  });
  // 一键更新题库的交互
  var up = $('#btn-bank-update');
  up && up.addEventListener('click', function(){ triggerBankUpdate(null); });
  var upYears = $('#btn-bank-update-years');
  upYears && upYears.addEventListener('click', function(){
    var raw = ($('#in-update-years') && $('#in-update-years').value) || '';
    var years = raw.split(/[^0-9]+/).map(function(s){ return parseInt(s, 10); })
                   .filter(function(y){ return y >= 2000 && y <= 2100; });
    if(!years.length){ toast('请填写年份，例如 2027,2028'); return; }
    triggerBankUpdate(years);
  });
  var rl2 = $('#btn-bank-reload2');
  rl2 && rl2.addEventListener('click', function(){ loadData().then(function(){ renderMeta(); render(); }); });
  var rf = $('#btn-bank-refresh');
  rf && rf.addEventListener('click', function(){ checkBankUpdate(); });
  var rs = $('#btn-bank-restore');
  rs && rs.addEventListener('click', function(){
    if(typeof fetch !== 'function') return;
    if(!confirm('确定把题库回退到最近一次备份吗？（覆盖 data/questions.js）')) return;
    fetch(HELPER_URL + '/restore', { method: 'POST' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        toast(j.ok ? ('已回退到 ' + j.restored) : ('回退失败：' + (j.error || '')));
        if(j.ok){ Store.patches = {}; loadData().then(function(){ renderMeta(); render(); }); }
      })
      .catch(function(e){ toast('连接辅助服务失败：' + e.message); });
  });
  // 首次进入题库时自动询问一次服务状态
  if(Store.bankInfo === undefined && !Store.bankAsked){
    Store.bankAsked = true;
    setTimeout(function(){
      if(typeof fetch !== 'function'){ Store.bankInfo = false; render(); return; }
      fetch(HELPER_URL + '/bank', { cache:'no-store' })
        .then(function(r){ return r.json(); })
        .then(function(j){ Store.bankInfo = j; if(currentView === 'bank') render(); })
        .catch(function(){ Store.bankInfo = false; if(currentView === 'bank') render(); });
    }, 120);
  }
}

/* ---------------- 渲染：错题库 ---------------- */
function renderMistakes(){
  var el = $('#view-mistakes');
  var ents = mistakeEntries();
  var must = ents.filter(function(e){ return e.level==='must'; });
  var opt  = ents.filter(function(e){ return e.level==='optional'; });
  var exps = expressionEntries();
  var h = '<div class="grid g4" style="margin-top:18px">'
    + statCard('必须修改条目', must.length+' <small>条</small>', '来自所有已批改作文')
    + statCard('可选优化条目', opt.length+' <small>条</small>', '进阶表达与地道性')
    + statCard('积累表达', exps.length+' <small>条</small>', '考场可复现的句式与搭配')
    + statCard('涉及篇数', gradedList().length+' <small>篇</small>', '自动汇总，无需手抄')
    + '</div>';

  var groups = {};
  ents.forEach(function(e){ (groups[e.cat] = groups[e.cat] || []).push(e); });
  var cats = Object.keys(groups).sort(function(a,b){ return groups[b].length - groups[a].length; });

  h += '<div class="card"><h2>错误类型分布</h2><div class="hint">按语法/内容类别自动归类（关键词匹配），点击展开具体条目。</div>';
  if(!cats.length) h += '<div class="empty">还没有批改数据。</div>';
  cats.forEach(function(cat){
    var open = !!Store.open['cat_'+cat];
    var list = groups[cat];
    var m = list.filter(function(x){return x.level==='must';}).length;
    h += '<div class="cat"><div class="chead" data-cat="'+esc(cat)+'">'
       + '<span class="caret">'+(open?'▾':'▸')+'</span><b>'+esc(cat)+'</b>'
       + '<span class="cnt">'+list.length+'</span>'
       + '<span class="isub">必须修改 '+m+' 条</span></div>';
    if(open){
      h += '<div class="cbody"><ul class="notes">';
      list.forEach(function(e){
        h += '<li class="'+esc(e.level==='priority'?'optional':e.level)+'">'
           + '<span class="pill '+esc(e.level==='priority'?'optional':e.level)+'">'
           + (e.level==='must'?'【必须修改】':(e.level==='priority'?'【复盘重点】':'【可选优化】'))+'</span> '
           + '<span class="isub">'+esc(e.subId)+' · '+esc(e.qTitle)+' · '+fmtTime(e.when)+'</span>';
        if(e.original) h += '<div class="orig" style="margin-top:4px">'+esc(e.original)+'</div>';
        h += '<div style="margin-top:5px"><span class="lbl">问题</span>'+rich(e.issue)+'</div>';
        if(e.revised) h += '<div class="rev"><span class="lbl">改法</span>'+rich(e.revised)+'</div>';
        if(e.explain) h += '<details class="det" style="margin-top:6px"><summary>为什么错 / 怎么自查</summary><div class="exp">'+rich(e.explain)+'</div></details>';
        h += '</li>';
      });
      h += '</ul></div>';
    }
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="card"><h2>表达积累库</h2><div class="hint">历次批改中 AI 挑出的实用表达，考前直接刷。</div>';
  if(!exps.length) h += '<div class="empty">暂无积累。</div>';
  else {
    h += '<ul class="notes">';
    exps.forEach(function(e){
      h += '<li><div class="en" style="font-weight:600">'+esc(e.phrase)+'</div>'
         + '<div class="kv">'+esc(e.meaning)+'</div>'
         + '<div class="exp" style="font-size:13.5px">'+rich(e.usage)+'</div>'
         + '<div class="isub" style="margin-top:4px">'+esc(e.qTitle)+' · '+fmtTime(e.when)+'</div></li>';
    });
    h += '</ul>';
  }
  h += '</div>';

  h += '<div class="card"><h2>导出 / 备份</h2><div class="hint">把本机提交导出为 JSON 文件，便于交给 AI 或备份。</div>'
    + '<div class="row"><button class="btn" id="btn-export">导出本机提交 JSON</button>'
    + '<button class="btn ghost" id="btn-wipe">清空本机数据（提交/草稿/图片/批改缓存）</button></div>'
    + '<div class="note" style="margin-top:12px">提交进 AI 的三种途径：<b>①</b> 双击 <span class="mono">start-helper.cmd</span> 后，本页会自动把提交同步成 <span class="mono">data/pending_submissions.json</span>，' 
    + '在对话里说一句<b>批改待批改作文</b>即可；<b>②</b> 点下面的按钮导出 JSON，另存为 <span class="mono">data/pending_submissions.json</span>；'
    + '<b>③</b> 直接把作文粘到对话里。批改结果一律写在 <span class="mono">data/patches/</span>。</div>'
    + '<div class="note" style="margin-top:8px">建议<b>固定用一个浏览器</b>练习：提交记录按浏览器分开保存，换浏览器会互相看不见，'
    + '还可能出现同一个编号 <span class="mono">sub_XXXX</span> 被两边各用一次（页面已能识别并忽略题目对不上的批改补丁）。'
    + '如果同一个文件路径在两个浏览器里都打开过，请只保留其中一份记录，并把另一份的 <span class="mono">data/pending_submissions.json</span> 清掉。</div></div>';

  el.innerHTML = h;
  bindItems(el);
  $('#btn-export') && $('#btn-export').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify({meta:{exportedAt:new Date().toISOString()}, completions:allCompletions(true)}, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'pending_submissions.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('已导出 pending_submissions.json —— 放进 data/ 目录后告诉我文件名即可');
  });
  $('#btn-wipe') && $('#btn-wipe').addEventListener('click', function(){
    var pend = pendingList().length;
    var msg = '将清空本机保存的全部提交记录、草稿、图片缓存与批改结果缓存：\n'
      + '· 共 ' + allCompletions(true).length + ' 条提交，其中【未批改 ' + pend + ' 条】会永久丢失（补丁里通常没有作文原文，无法恢复）\n'
      + '· 清空后本页不再记录这些提交；data/patches/ 里的批改补丁文件不会被删除\n\n'
      + '重要：如果这些提交也同步到了服务端（data/pending_submissions.json），清空后请把该文件一并删掉——'
      + '否则它会残留成"网页上并不存在的待批改记录"。\n\n'
      + '建议先点「导出本机提交 JSON」留一份备份。确定要清除吗？';
    if(!confirm(msg)) return;
    localStorage.removeItem(LS_SUBS); localStorage.removeItem(LS_IMGS); localStorage.removeItem(LS_META);
    localStorage.removeItem(LS_PATCH);          // 补丁缓存也要清，否则页面会凭缓存"复活"出幽灵记录
    Store.subs = []; Store.imgs = {}; Store.patches = {};
    toast('已清除本机缓存；记得同时删掉 data/pending_submissions.json（如果存在）');
    renderMeta(); render();
  });
}

/* ---------------- 渲染：趋势 ---------------- */
function renderTrend(){
  var el = $('#view-trend');
  // 按「批改时间」正序（没有 gradedAt 的用提交时间兜底），与页面文案一致
  var g = gradedList().slice().sort(function(a, b){
    var ta = parseTime(a.grading && a.grading.gradedAt ? a.grading.gradedAt : (a.gradedAt || a.submittedAt));
    var tb = parseTime(b.grading && b.grading.gradedAt ? b.grading.gradedAt : (b.gradedAt || b.submittedAt));
    if(ta && tb) return ta - tb;
    return String(a.id).localeCompare(String(b.id));
  });
  var series = g.map(function(c){
    return { label: c.id, title: questionById(c.questionId).title, rate: rateOf(c),
             score: scoreOf(c), full: fullOf(c), when: c.gradedAt||c.submittedAt,
             kind: questionById(c.questionId).kind };
  }).filter(function(x){ return x.rate != null; });

  var h = '<div class="card"><h2>分数趋势</h2><div class="hint">按批改时间排列的得分率曲线。大作文 / 小作文 / 翻译满分不同，统一换算成得分率更可比。</div>';
  if(series.length < 2){
    h += '<div class="empty">至少需要 2 篇已批改记录才能画曲线（当前 '+series.length+' 篇）。</div>';
  } else {
    h += chartSvg(series);
  }
  h += '</div>';

  h += '<div class="card"><h2>逐篇明细</h2>';
  if(!series.length) h += '<div class="empty">暂无已批改记录。</div>';
  else{
    h += '<table class="pttable"><thead><tr><th>提交</th><th>题目</th><th class="c">得分</th><th class="c">得分率</th><th>批改时间</th></tr></thead><tbody>';
    series.slice().reverse().forEach(function(x){
      h += '<tr><td class="mono">'+esc(x.label)+'</td><td>'+esc(x.title)+'</td>'
         + '<td class="c">'+x.score+' / '+x.full+'</td>'
         + '<td class="c"><b>'+pct(x.rate)+'</b></td><td>'+fmtTime(x.when)+'</td></tr>';
    });
    h += '</tbody></table>';
    var avg = series.reduce(function(a,b){return a+b.rate;},0)/series.length;
    var last = series.slice(-3);
    var lastAvg = last.reduce(function(a,b){return a+b.rate;},0)/last.length;
    h += '<div class="note" style="margin-top:12px">总体平均得分率 <b>'+pct(avg)+'</b>；最近 3 次 <b>'+pct(lastAvg)+'</b>。'
       + (lastAvg > avg ? '近期呈上升趋势，继续保持并逐步提高论证深度。' : '近期与总体持平或略低，建议回看「错题与语言点库」里出现次数最多的类别，做一次专项清理。')
       + '</div>';
  }
  h += '</div>';
  el.innerHTML = h;
  bindItems(el);
}
function chartSvg(series){
  var W = 900, H = 230, padL = 46, padR = 18, padT = 18, padB = 34;
  var n = series.length;
  var xs = function(i){ return padL + (W-padL-padR) * (n===1?0.5:i/(n-1)); };
  var ys = function(r){ return padT + (H-padT-padB) * (1-r); };
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  [0,0.25,0.5,0.75,1].forEach(function(r){
    s += '<line x1="'+padL+'" y1="'+ys(r)+'" x2="'+(W-padR)+'" y2="'+ys(r)+'" stroke="#ece6da" stroke-width="1"/>'
      +  '<text x="'+(padL-8)+'" y="'+(ys(r)+4)+'" text-anchor="end" font-size="11" fill="#8d8477">'+(r*100)+'%</text>';
  });
  var pts = series.map(function(x,i){ return xs(i)+','+ys(x.rate); });
  s += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#1f4e46" stroke-width="2.5"/>';
  series.forEach(function(x,i){
    s += '<circle cx="'+xs(i)+'" cy="'+ys(x.rate)+'" r="4.5" fill="#fff" stroke="#9c3b34" stroke-width="2.5"/>';
    var showLabel = n <= 12 || i % Math.ceil(n/12) === 0;
    if(showLabel) s += '<text x="'+xs(i)+'" y="'+(H-12)+'" text-anchor="middle" font-size="10.5" fill="#8d8477">'+esc(String(x.label).replace('sub_',''))+'</text>';
    s += '<title>'+esc(x.label+' '+x.title+'：'+x.score+'/'+x.full+' = '+pct(x.rate))+'</title>';
  });
  s += '</svg><div class="legend">横轴为提交编号（正序），纵轴为得分率；鼠标悬停数据点可看题目与分数。</div>';
  return s;
}

/* ---------------- 顶栏与视图切换 ---------------- */
function renderMeta(){
  var st = stats();
  $('#m-sub').textContent = st.submitted;
  $('#m-graded').textContent = st.graded;
  $('#m-rate').textContent = pct(st.avgRate);
  var el = $('#m-sync');
  el.textContent = Store.syncNote;
  el.className = 'chip' + (Store.syncNote.indexOf('⚠') === 0 ? ' warn' : '');
  var b = $('#b-pending');
  if(st.pending > 0){ b.hidden = false; b.textContent = st.pending; } else { b.hidden = true; }
  var exam = Store.seed.meta && Store.seed.meta.examDate;
  var d = exam ? new Date(exam+'T00:00:00') : null;
  if(d && !isNaN(d.getTime())){
    var days = Math.ceil((d - new Date()) / 86400000);
    $('#cd').textContent = days > 0 ? (days + ' 天（' + exam + '）') : '已过 ' + (-days) + ' 天';
  } else { $('#cd').textContent = '未设置'; }
}
var currentView = 'board';
function switchView(v){
  var extra = '';
  var qi = String(v || '').indexOf('?');
  if(qi >= 0){ extra = v.slice(qi+1); v = v.slice(0, qi); }
  if(['board','submit','results','bank','mistakes','trend'].indexOf(v) < 0) v = 'board';
  currentView = v;
  // 支持 index.html#bank?open=q_mock_01_major / #results?compare=sub_0001 直接展开
  var mo = /(?:^|&)open=([^&]+)/.exec(extra);
  var mc = /(?:^|&)compare=([^&]+)/.exec(extra);
  if(mc) Store.compare = decodeURIComponent(mc[1]);
  function applyOpen(){
    if(!mo) return;
    var key = decodeURIComponent(mo[1]);
    if(Store.seed.questions.some(function(x){ return x.id === key; })) Store.open['q_' + key] = true;
    else Store.open[key] = true;
  }
  applyOpen();
  try{
    var want = '#' + v + (extra ? '?' + extra : '');
    if(location.hash !== want) location.hash = want;
  }catch(e){}
  $('#tabs').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-view') === v); });
  ['board','submit','results','bank','mistakes','trend'].forEach(function(k){
    var el = $('#view-'+k); if(el) el.hidden = (k !== v);
  });
  renderMeta();
  render();
  // 进入视图后再展开一次：覆盖"该条目已经被渲染过"的情况
  if(mo){ applyOpen(); render(); }
}
function render(){
  if(currentView==='board') renderBoard();
  else if(currentView==='submit') renderSubmit();
  else if(currentView==='results') renderResults();
  else if(currentView==='bank') renderBank();
  else if(currentView==='mistakes') renderMistakes();
  else if(currentView==='trend') renderTrend();
  // 注意：不要在这里再 bindItems(document)。各视图渲染函数内部已经 bindItems(el)，
  // 而 innerHTML 会在每次渲染时重建节点——重复绑定会让 [data-toggle] 的取反处理器
  // 一次点击执行两遍，导致"展开/收起"永远打不开。
  bindViewLinks(document);
}

/* ---------------- 启动 ---------------- */
function boot(){
  Store.subs = loadLS(LS_SUBS, []) || [];
  Store.imgs = loadLS(LS_IMGS, {}) || {};
  Store.patches = loadLS(LS_PATCH, {}) || {};   // 上次会话已读到的补丁（file:// 下 fetch 受限时仍可用）
  var meta = loadLS(LS_META, {}) || {};
  Store.draftText = meta.draftText || '';
  Store.draftQuestionId = meta.draftQuestionId || '';
  Store.prefillEdit = meta.prefillEdit || null;
  if(Store.dataWarnings && Store.dataWarnings.length){
    setTimeout(function(){ toast(Store.dataWarnings.join('；')); }, 800);
  }

  $('#tabs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-view]');
    if(b) switchView(b.getAttribute('data-view'));
  });
  $('#btn-reload').addEventListener('click', function(){
    Store.syncNote = '正在重新加载…'; renderMeta();
    loadData().then(function(){ toast('数据已重新加载'); });
  });
  // 兼容总览/其它视图里的「去题库 →」类链接（只绑一次）
  bindViewLinks(document);

  loadData().then(function(){
    // 支持用 URL hash 直接打开某个视图（如 index.html#bank），也便于自动截图验证
    var hash = (location.hash || '').replace('#','');
    if(hash) switchView(hash);
    window.addEventListener('hashchange', function(){
      switchView((location.hash||'').replace('#',''));
    });
    // 自动轮询：检测 AI 写回的新补丁
    setInterval(function(){
      if(document.hidden) return;
      if(Store.loadingPromise) return;          // 正在整体重载时跳过这一轮，避免互相清空
      rebuildPatchIds();                        // 本会话新提交的编号也要纳入探测
      var before = {};
      Object.keys(Store.patches).forEach(function(id){ before[id] = Store.patches[id]; });
      scanPatchFiles().then(function(res){
        var foundIds = (res && res.ids) || [];
        var after = {};
        foundIds.forEach(function(id){ after[id] = window.__KAOYAN_PATCHES[id]; });
        var changed = false;
        Object.keys(after).forEach(function(id){
          if(!before[id] || JSON.stringify(before[id]) !== JSON.stringify(after[id])) changed = true;
        });
        Object.keys(before).forEach(function(id){ if(!after[id]) changed = true; });   // 补丁被删/被改写也要反映
        // 以磁盘为准（补丁被删除后页面不再显示旧结果）；只有"一个都没读到"时才回退到缓存
        var nothingLoaded = !(res && res.loaded);
        if(nothingLoaded && Object.keys(before).length){
          Store.syncNote = '⚠ 未能读取 data/patches/（仍然显示上次结果）';
        } else {
          Store.patches = after;
          Store.patchFiles = foundIds;
          saveLS(LS_PATCH, Store.patches);
        }
        if(changed){
          toast('批改结果已更新');
          Store.syncNote = '数据已加载 · 补丁 ' + Store.patchFiles.length + ' 个 · ' + fmtTime(new Date().toISOString());
          renderMeta(); render();
        }
        var conf = notePatchConflicts();
        if(conf.length && changed) toast('⚠ ' + conf.join('、') + '：补丁与题目不一致，已忽略');
        if(conf.length){ renderMeta(); render(); }
      });
    }, POLL_MS);
  });
}

// 本地文件模式：script 标签加载可用，fetch 不可用（补丁已改为 JS 形式）
if(location.protocol === 'file:'){
  Store.syncNote = '本地文件模式（file://）';
}
// 诊断出口：供离线自检脚本读取内部状态（不影响正常使用）
window.__KAOYAN_DIAG = {
  ready: false,
  get store(){ return Store; },
  // 供离线自检脚本驱动渲染：diag.render('board') / diag.renderOpen('bank','q_mock_01_major')
  render: function(v){ switchView(v || 'board'); return ''; },
  renderOpen: function(v, key){
    switchView(v);
    if(key){
      var isQ = Store.seed.questions.some(function(x){ return x.id === key; });
      Store.open[isQ ? 'q_' + key : key] = true;
      render();
    }
    return '';
  },
  get html(){
    var out = {};
    ['board','submit','results','bank','mistakes','trend'].forEach(function(k){
      var el = $('#view-' + k);
      out[k] = el ? el.innerHTML : '';
    });
    return out;
  },
  get resolved(){
    return allCompletions(true).map(function(c){
      var q = questionById(c.questionId);
      return { id:c.id, questionId:c.questionId, qTitle:q.title, kind:q.kind, status:c.status,
               essayLen:(c.essayText||'').length, score: scoreOf(c) };
    });
  },
  get seedQuestions(){ return Store.seed.questions.length; },
  get patchFiles(){ return Store.patchFiles; },
  // 新增：分类统计 / 练习次数 / 相似题识别，供自检使用
  get categories(){
    var c = { real:0, mock:0, mine:0 };
    allQuestions().forEach(function(q){ c[catOf(q)]++; });
    return c;
  },
  practiceCount: function(qid){ return practiceStats(qid).total; },
  setDraftQuestion: function(qid){ Store.draftQuestionId = qid; render(); return qid; },
  // 供自检模拟批改服务：注入 helper 状态或直接触发检测
  setHelper: function(state, info){ Store.helper = { state: state, info: info || null }; render(); },
  checkHelper: function(){ checkHelper(); },
  similarity: function(a, b){ return similarity(a, b); },
  findSimilar: function(text){ return findSimilarQuestions(text, 3).map(function(x){ return { id:x.q.id, score:x.score }; }); },
  bestDuplicate: function(text){ var h = bestDuplicate(text); return h ? { id:h.q.id, score:h.score } : null; },
  // 供自检：改稿链与对比视图
  chainOf: function(id){
    var c = allCompletions(true).filter(function(x){ return x.id === id; })[0];
    if(!c) return [];
    return relatedChain(c).map(function(x){ return x.id; });
  },
  addDraft: function(sub){
    var c = { id:sub.id, questionId:sub.questionId, submittedAt:sub.submittedAt || new Date().toISOString(),
              status:'pending', essayText:sub.essayText || 'draft', note:'', imagePath:'',
              revises:sub.revises || undefined, draftGroup:sub.draftGroup || undefined, draftNo:sub.draftNo || undefined };
    Store.subs.push(c); return c.id;
  },
  renderCompare: function(id){
    Store.compare = id;
    currentView = 'results';
    ['board','submit','results','bank','mistakes','trend'].forEach(function(k){
      var el = $('#view-' + k); if(el) el.hidden = (k !== 'results');
    });
    render();
    return window.__KAOYAN_DIAG ? window.__KAOYAN_DIAG.html.results : '';
  },
  get currentView(){ return currentView; },
  // 供自检：临时塞一条高编号提交，验证补丁探测范围会跟着放大
  testHighSubId: function(id){
    Store.subs.push({ id:id, questionId:'q_test_high', submittedAt:new Date().toISOString(), status:'pending', essayText:'x' });
    rebuildPatchIds();
    var run = PATCH_IDS.slice();
    Store.subs.pop();
    rebuildPatchIds();
    return run;
  }
};
window.__KAOYAN_SCRIPTS = [];
var _appendChild = document.head.appendChild.bind(document.head);
document.head.appendChild = function(el){
  if(el && el.tagName === 'SCRIPT'){ window.__KAOYAN_SCRIPTS.push(el.src); }
  return _appendChild(el);
};
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
