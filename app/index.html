<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研英语（一）（二）· 作文与翻译练习台</title>
<style>
  :root{
    --bg:#f6f4ef; --paper:#fffdf9; --ink:#26221d; --ink2:#5b5348; --ink3:#8d8477;
    --line:#e3ddd1; --accent:#9c3b34; --accent2:#1f4e46; --gold:#b8892f;
    --must:#b3261e; --mustbg:#fdecea; --opt:#8a6a12; --optbg:#fdf6e3; --ok:#2c6b4f; --okbg:#eaf6f0;
    --shadow:0 1px 2px rgba(38,34,29,.05),0 8px 24px rgba(38,34,29,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"Cascadia Mono",Consolas,"Courier New",monospace}
  .en{font-family:Georgia,"Times New Roman",serif; font-size:15.5px}
  a{color:var(--accent2)}
  h1,h2,h3,h4{line-height:1.35; margin:0}

  /* ---------- 布局 ---------- */
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px 80px}
  header.top{background:linear-gradient(180deg,#fffdf9,#f9f6f0); border-bottom:1px solid var(--line)}
  .topinner{max-width:1180px; margin:0 auto; padding:22px 20px 0}
  .brand{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  .brand h1{font-size:23px; letter-spacing:.5px}
  .brand .seal{font-size:12px; color:#fff; background:var(--accent); padding:2px 8px; border-radius:3px; letter-spacing:1px}
  .brand .sub{color:var(--ink3); font-size:13px}
  .topmeta{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0 14px; font-size:13px; color:var(--ink2)}
  .chip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:3px 11px; font-size:12.5px; color:var(--ink2)}
  .chip b{color:var(--ink)}
  .chip.warn{border-color:#e6c9c4; background:#fdf3f1; color:#8c2f28}
  nav.tabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line)}
  nav.tabs button{
    appearance:none; background:transparent; border:0; border-bottom:2px solid transparent;
    padding:10px 15px; font-size:14.5px; color:var(--ink2); cursor:pointer; font-family:inherit;
  }
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
  nav.tabs .badge{display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--accent); color:#fff; font-size:11.5px; line-height:18px; text-align:center; font-weight:600}

  /* ---------- 卡片 ---------- */
  .card{background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:20px 22px; margin-top:18px}
  .card>h2{font-size:17px; margin-bottom:4px}
  .card .hint{color:var(--ink3); font-size:13px; margin:2px 0 14px}
  .grid{display:grid; gap:16px}
  @media(min-width:900px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} }
  @media(max-width:899px){ .g2,.g3,.g4{grid-template-columns:1fr} }

  .stat{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
  .stat .k{font-size:12.5px; color:var(--ink3)}
  .stat .v{font-size:26px; font-weight:600; letter-spacing:.5px; margin-top:2px}
  .stat .v small{font-size:13px; font-weight:400; color:var(--ink3)}
  .stat .f{font-size:12.5px; color:var(--ink3); margin-top:4px}

  /* ---------- 控件 ---------- */
  button.btn{
    appearance:none; font-family:inherit; font-size:14px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px; padding:7px 14px;
  }
  button.btn:hover{border-color:#cfc6b6; background:#fffcf6}
  button.btn.primary{background:var(--accent2); border-color:var(--accent2); color:#fff}
  button.btn.primary:hover{background:#17403a}
  button.btn.ghost{background:transparent}
  button.btn:disabled{opacity:.5; cursor:not-allowed}
  select,input[type=text],input[type=date],textarea{
    font-family:inherit; font-size:14px; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:7px; padding:8px 10px; width:100%;
  }
  textarea{line-height:1.7; resize:vertical}
  select:focus,input:focus,textarea:focus{outline:2px solid #dbe7e3; outline-offset:0; border-color:#b9cfc8}
  label.fld{display:block; margin:12px 0 0}
  label.fld>span{display:block; font-size:13px; color:var(--ink2); margin-bottom:5px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .spacer{flex:1}

  /* ---------- 徽标 ---------- */
  .pill{display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink2); white-space:nowrap}
  .pill.pending{background:#fdf6e3; border-color:#ecdcae; color:#7d5f10}
  .pill.graded{background:#eaf6f0; border-color:#c4e2d4; color:#245e46}
  .pill.must{background:var(--mustbg); border-color:#f0c4bf; color:var(--must)}
  .pill.optional{background:var(--optbg); border-color:#ecdcae; color:var(--opt)}
  .pill.ok{background:var(--okbg); border-color:#c4e2d4; color:var(--ok)}
  .pill.k-major{background:#fdf1ef; border-color:#eecdc7; color:#8c2f28}
  .pill.k-minor{background:#eef4fb; border-color:#cfdff0; color:#2b4f75}
  .pill.k-translation{background:#f2effa; border-color:#dcd5ef; color:#4a3a7a}
  .pill.k-drill{background:#eef8f4; border-color:#cbe8dd; color:#25604c}
  .pill.c-real{background:#fdeeee; border-color:#f0c8c4; color:#a32b22}
  .pill.c-mock{background:#eff4fa; border-color:#cfdff0; color:#2b4f75}
  .pill.c-mine{background:#fdf6e3; border-color:#eadfae; color:#7d5f10}
  .pill.c-en1{background:#eef4fb; border-color:#c9dcf0; color:#1f4e7a}
  .pill.c-en2{background:#f7eef8; border-color:#e4cfe8; color:#6b3a72}
  .pill.done{background:#eaf6f0; border-color:#c4e2d4; color:#245e46}
  .pill.flat{background:#f4f1ea; border-color:#e3ddd1; color:#8d8477}
  .practice{border:1px solid var(--line); border-radius:8px; background:#fdfbf6; padding:12px 14px; margin:12px 0}
  .practice .ptitle{font-size:14px; font-weight:600; margin-bottom:4px}
  .catgrid{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 4px}
  .catsum{border:1px solid var(--line); border-radius:8px; padding:8px 14px; background:var(--paper); font-size:13.5px; color:var(--ink2)}
  .catsum b{font-size:17px; color:var(--ink)}
  .dup{border:1px solid #ecdcae; background:#fdf9ee; border-radius:8px; padding:10px 12px; margin-top:8px; font-size:13.5px}
  .dup .drow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:4px 0}
  .srcline{background:#f7f5ef; border-radius:6px; padding:8px 10px; font-size:13px; color:var(--ink2); margin-top:6px}
  .srcline .en{font-size:13px}
  /* 改稿并排对比 */
  .cmpscroll{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff; margin-top:12px}
  .cmptable{border-collapse:separate; border-spacing:0; width:100%}
  .cmptable th,.cmptable td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:10px 12px; vertical-align:top; text-align:left; font-size:13.5px}
  .cmptable thead th{background:#faf7f1; font-size:13px; min-width:230px; position:sticky; top:0}
  .cmptable th.cmpleft{background:#faf7f1; min-width:120px; width:120px; position:sticky; left:0; z-index:1; font-size:13px}
  .cmptable thead th.cmpleft{z-index:2}
  .cmptable tr:last-child th,.cmptable tr:last-child td{border-bottom:0}
  .cmpcell{min-width:230px; max-width:340px}
  .cmpessay{white-space:normal; line-height:1.75; font-family:Georgia,"Times New Roman",serif; font-size:13px; max-height:280px; overflow:auto; background:#fdfcf8; border-radius:6px; padding:8px 10px}
  .score{font-weight:700; color:var(--accent)}
  .score.big{font-size:30px}

  /* ---------- 题目 ---------- */
  .qhead{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
  .qbody{margin-top:10px; display:grid; gap:16px}
  @media(min-width:900px){ .qbody.withfig{grid-template-columns:minmax(0,1fr) 380px} }
  .figurebox{border:1px solid var(--line); border-radius:8px; background:#fff; padding:8px}
  .figurebox svg{display:block; width:100%; height:auto}
  .cap{font-size:12px; color:var(--ink3); text-align:center; margin-top:6px}
  .prompt-en{white-space:pre-wrap; background:#fcfaf5; border-left:3px solid #ddd3c2; padding:12px 14px; border-radius:0 6px 6px 0}
  .zh{color:var(--ink2); font-size:14.5px}
  .sent-list{counter-reset:s; margin:8px 0 0; padding:0; list-style:none}
  .sent-list li{position:relative; padding:6px 0 6px 34px; border-bottom:1px dashed #ece6da; font-family:Georgia,"Times New Roman",serif}
  .sent-list li:last-child{border-bottom:0}
  .sent-list li:before{counter-increment:s; content:"[" counter(s) "]"; position:absolute; left:0; top:6px; color:var(--accent); font-size:13px; font-family:inherit}

  /* ---------- 批改展示 ---------- */
  .essay{white-space:pre-wrap; background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; font-family:Georgia,"Times New Roman",serif; font-size:15.5px; line-height:2}
  .essay.rev strong{background:#fff3cf; padding:0 2px; border-radius:3px; font-weight:600}
  mark.err{border-radius:3px; padding:0 2px; cursor:help}
  mark.must{background:#ffe0dc; border-bottom:2px solid #b3261e; color:#7a1a14}
  mark.optional{background:#fdf1cd; border-bottom:2px solid #b8892f}
  mark.ok{background:#e6f5ec; border-bottom:2px solid #2c6b4f}
  .notes{margin:0; padding:0; list-style:none}
  .notes li{border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; background:#fff}
  .notes li.must{border-left:4px solid var(--must)}
  .notes li.optional{border-left:4px solid var(--gold)}
  .notes li.ok{border-left:4px solid var(--ok)}
  .notes .orig{font-family:Georgia,"Times New Roman",serif; color:var(--ink2)}
  .notes .lbl{font-size:12px; color:var(--ink3); margin-right:6px}
  .notes .rev{font-family:Georgia,"Times New Roman",serif; background:#f7fbf9; border-radius:5px; padding:6px 9px; margin:6px 0}
  .notes .exp{font-size:14px; color:var(--ink2); white-space:pre-wrap}
  .dim{display:grid; grid-template-columns:110px 1fr; gap:10px; padding:7px 0; border-bottom:1px dashed #ece6da; font-size:14px}
  .dim:last-child{border-bottom:0}
  .kv{font-size:14px; color:var(--ink2)}
  .kv b{color:var(--ink)}
  ul.tight{margin:6px 0 0; padding-left:20px}
  ul.tight li{margin:3px 0}
  .pttable{width:100%; border-collapse:collapse; font-size:13.5px; margin:6px 0}
  .pttable th,.pttable td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
  .pttable th{background:#faf7f1; font-weight:600; color:var(--ink2); font-size:12.5px}
  .pttable td.c{text-align:center; white-space:nowrap}

  /* ---------- 列表条目 ---------- */
  .item{border:1px solid var(--line); background:var(--paper); border-radius:10px; margin-bottom:14px; overflow:hidden}
  .item>.ihead{display:flex; gap:12px; align-items:center; padding:13px 16px; cursor:pointer; flex-wrap:wrap}
  .item>.ihead:hover{background:#fdfbf6}
  .item .ititle{font-weight:600; font-size:15px}
  .item .isub{color:var(--ink3); font-size:12.5px}
  .item .ibody{border-top:1px solid var(--line); padding:16px}
  .caret{color:var(--ink3); font-size:12px}

  /* ---------- 错题库 ---------- */
  .cat{border:1px solid var(--line); border-radius:10px; background:var(--paper); margin-bottom:12px; overflow:hidden}
  .cat>.chead{display:flex; align-items:center; gap:10px; padding:11px 15px; cursor:pointer}
  .cat>.chead:hover{background:#fdfbf6}
  .cat .cnt{font-size:12.5px; color:#fff; background:var(--accent); border-radius:999px; padding:1px 9px}
  .cat .cbody{padding:0 15px 12px; border-top:1px solid var(--line)}
  .cat .cbody .notes li{background:#fffdf9}

  /* ---------- 趋势 ---------- */
  .chart{width:100%; height:230px; background:var(--paper); border:1px solid var(--line); border-radius:10px}
  .legend{font-size:12.5px; color:var(--ink3); margin-top:6px}

  /* ---------- 提示 ---------- */
  .note{background:#f4f8f6; border:1px solid #d7e8e1; border-left:4px solid var(--accent2); border-radius:6px; padding:11px 14px; font-size:14px; color:var(--ink2)}
  .note.warn{background:#fdf7ef; border-color:#ecdcc2; border-left-color:var(--gold)}
  .empty{color:var(--ink3); text-align:center; padding:34px 10px; font-size:14px}
  footer{color:var(--ink3); font-size:12.5px; text-align:center; padding:26px 10px 0}
  .split{display:grid; gap:12px}
  @media(min-width:900px){ .split{grid-template-columns:1fr 1fr} }
  .thumb{max-width:180px; border:1px solid var(--line); border-radius:6px; margin-top:8px; display:block}
  details.det{margin-top:10px; border:1px solid var(--line); border-radius:8px; background:#fff}
  details.det>summary{cursor:pointer; padding:9px 13px; font-size:14px; color:var(--ink2)}
  details.det[open]>summary{border-bottom:1px solid var(--line)}
  details.det>div{padding:12px 14px}
  .toast{position:fixed; right:20px; bottom:22px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13.5px; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none; z-index:99; max-width:70vw}
  .toast.on{opacity:1; transform:none}
</style>
</head>
<body>
<header class="top">
  <div class="topinner">
    <div class="brand">
      <h1>考研英语（一）（二）· 作文与翻译练习台</h1>
      <span class="seal">kaoyan-english-tutor</span>
      <span class="sub">提交作文 → AI 按考研标准批改 → 结果自动回填本页</span>
    </div>
    <div class="topmeta">
      <span class="chip">距考试 <b id="cd">—</b></span>
      <span class="chip">已提交 <b id="m-sub">0</b> 篇</span>
      <span class="chip">已批改 <b id="m-graded">0</b> 篇</span>
      <span class="chip">平均得分率 <b id="m-rate">—</b></span>
      <span class="chip" id="m-sync">数据未加载</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="btn-reload">↻ 重新加载数据</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="board" class="on">总览</button>
      <button data-view="submit">提交作文<span class="badge" id="b-pending" hidden>0</span></button>
      <button data-view="results">批改结果</button>
      <button data-view="bank">题库</button>
      <button data-view="mistakes">错题与语言点库</button>
      <button data-view="trend">分数趋势</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section id="view-board"></section>
  <section id="view-submit" hidden></section>
  <section id="view-results" hidden></section>
  <section id="view-bank" hidden></section>
  <section id="view-mistakes" hidden></section>
  <section id="view-trend" hidden></section>
  <footer>
    评分参考为公开流传的档位整理，<b>非官方阅卷标准</b>，结果仅供练习参考。数据全部保存在本机，不联网。
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   考研英语（一）（二）练习台 · 前端逻辑
   数据来源三层合并（优先级从高到低）：
     1) data/patches/*.json  → AI 写回的批改结果（本次会话内已加载过的缓存）
     2) localStorage         → 本机新提交/草稿
     3) data/state.js        → 题库与种子提交
   ===================================================================== */
(function(){
'use strict';

/* 题型标签不带分值（英语一与英语二满分不同），分值一律按题目实际 fullScore 显示 */
var KIND_LABEL = { major:'大作文', minor:'小作文', translation:'翻译', drill:'长难句专项' };
var KIND_FULL = { en1:{ major:20, minor:10, translation:10 }, en2:{ major:15, minor:10, translation:15 } };
function kindLabel(q){
  if(q && typeof q === 'object'){
    var s = subjOf(q);
    var f = (KIND_FULL[s] || {})[q.kind];
    return (KIND_LABEL[q.kind] || q.kind) + (f ? (' ' + f + '分') : '');
  }
  return KIND_LABEL[q] || q;
}
var KIND_CLASS = { major:'k-major', minor:'k-minor', translation:'k-translation', drill:'k-drill' };
var CAT_LABEL = { real:'考研真题', mock:'模拟题', mine:'我的题目' };
var CAT_CLASS = { real:'c-real', mock:'c-mock', mine:'c-mine' };
/* 科目：英语一（en1）/ 英语二（en2）—— 题库用 questions[].subject 标记，缺省按英语一 */
var SUBJ_LABEL = { en1:'英语一', en2:'英语二' };
var SUBJ_CLASS = { en1:'c-en1', en2:'c-en2' };
function subjOf(q){
  if(!q) return 'en1';
  if(q.subject === 'en2' || q.subject === 'en1') return q.subject;
  if(/^q_en2_/.test(String(q.id || ''))) return 'en2';
  return 'en1';
}
function subjPill(q){
  var s = subjOf(q);
  return '<span class="pill ' + SUBJ_CLASS[s] + '">' + SUBJ_LABEL[s] + '</span>';
}
function catOf(q){
  if(q && q.category) return q.category;
  if(!q) return 'mock';
  return (q.year && String(q.year).indexOf('真题') >= 0) ? 'real' : 'mock';
}
function catPill(q){
  var c = catOf(q);
  return '<span class="pill ' + CAT_CLASS[c] + '">' + CAT_LABEL[c] + '</span>';
}
var LS_SUBS = 'kaoyan_subs_v1';
var LS_PATCH = 'kaoyan_patch_cache_v1';
var LS_META = 'kaoyan_meta_v1';
var LS_IMGS = 'kaoyan_imgs_v1';
var LS_MINEQ = 'kaoyan_mineq_v1';   // 用户自己上传的题目
var POLL_MS = 8000;

var Store = {
  seed: { meta:{}, questions:[], completions:[] },
  subs: [],          // localStorage 提交
  patches: {},       // id -> patch
  patchFiles: [],    // 由预扫描得到的补丁文件名
  imgs: {},          // 本机暂存图片 dataURL
  syncNote: '数据未加载',
  lastLoad: null,
  open: {},          // 折叠状态
  filter: { results:'all', bank:'all' },
  markingOn: true
};

/* ---------------- 工具 ---------------- */
function $(s, root){ return (root||document).querySelector(s); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function rich(s){
  // 先转义，再把 **加粗** 变成 <strong>，保留换行
  return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}
function parseTime(t){
  if(!t) return null;
  var d = new Date(t);
  return isNaN(d.getTime()) ? null : d;
}
function fmtTime(t){
  var d = parseTime(t);
  if(!d) return t || '—';
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function toast(msg){
  var el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2600);
}
function num(v, d){ var n = parseFloat(v); return isNaN(n) ? (d===undefined?null:d) : n; }
function pct(v){ return (v==null) ? '—' : (Math.round(v*1000)/10)+'%'; }

/* 从 localStorage 读 JSON：解析失败不要静默丢数据——先备份原始字符串，
   再尽量"抢救"出数组里完整的对象，并把损坏情况告诉调用方。 */
function loadLSStrict(key){
  var raw;
  try { raw = localStorage.getItem(key); } catch(e){ return { ok:true, value:null, storageError:String(e.message||e) }; }
  if(!raw) return { ok:true, value:null, raw:null };
  try { return { ok:true, value: JSON.parse(raw), raw:raw }; }
  catch(e){
    try { localStorage.setItem(key + '.corrupt.bak', raw); } catch(_) {}
    var salvaged = null;
    var m = /^\s*\[/.test(raw);
    if(m){
      // 粗暴抢救：把最外层数组里能被单独解析的对象挑出来
      var items = raw.split(/\},\s*\{/);
      if(items.length > 1){
        var list = [];
        items.forEach(function(chunk, i){
          var s = chunk;
          if(i > 0) s = '{' + s;
          if(i < items.length - 1) s = s + '}';
          try { var o = JSON.parse(s); if(o && typeof o === 'object') list.push(o); } catch(_) {}
        });
        if(list.length) salvaged = list;
      }
    }
    return { ok:false, error:String(e.message || e), raw:raw, value:salvaged, salvaged: salvaged ? salvaged.length : 0 };
  }
}
function loadLS(key, dflt){
  var r = loadLSStrict(key);
  if(r.ok && r.value != null) return r.value;
  if(!r.ok){
    Store.dataWarnings = Store.dataWarnings || [];
    Store.dataWarnings.push('本机数据「' + key + '」解析失败（已备份为 ' + key + '.corrupt.bak'
      + (r.salvaged ? '，已抢救出 ' + r.salvaged + ' 条' : '') + '）');
  }
  return (r.value != null) ? r.value : dflt;
}
function saveLS(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ toast('本机存储写入失败：'+e.message); return false; }
}

/* ---------------- 动态加载外部数据（file:// 可用） ---------------- */
function injectScript(src, onload, onerror){
  if(window.__KAOYAN_HARNESS__){ window.__KAOYAN_SCRIPTS = window.__KAOYAN_SCRIPTS || []; window.__KAOYAN_SCRIPTS.push(src); if(onload) onload(); return null; }
  var s = document.createElement('script');
  s.src = src + (src.indexOf('?')>=0?'&':'?') + '_t=' + Date.now();
  s.onload = function(){ if(onload) onload(); };
  s.onerror = function(){ if(onerror) onerror(); };
  document.head.appendChild(s);
  return s;
}
/* 补丁以 JS 形式加载（file:// 下 fetch 会被拦截，script 标签才可靠）：
   每个 data/patches/sub_XXXX.js 会执行 window.__KAOYAN_PATCHES['sub_XXXX'] = {...}
   探测范围是动态的：已经见过哪些提交编号，就探到这个编号 + 8，
   所以不会因为"练到第 25 篇"而漏掉补丁；也不需要在加新题时改代码。 */
var PATCH_IDS = [];
function rebuildPatchIds(){
  var max = 0;
  function note(id){
    var m = /^sub_(\d+)$/.exec(id || '');
    if(m) max = Math.max(max, parseInt(m[1], 10));
  }
  allCompletions(true).forEach(function(c){ note(c.id); });
  Object.keys(Store.patches || {}).forEach(note);
  mineQuestions().forEach(function(q){
    (q.attempts || []).forEach(function(id){ note(typeof id === 'string' ? id : (id && id.id)); });
  });
  Object.keys(Store.imgs || {}).forEach(note);
  max = Math.max(max, 4);                       // 起步至少探 4 个，方便首次使用
  var out = [];
  for(var i = 1; i <= max + 8; i++) out.push('sub_' + ('000'+i).slice(-4));
  PATCH_IDS = out;
}
function scanPatchFiles(){
  if(window.__KAOYAN_HARNESS__){
    // 仿真模式：由外部自检脚本负责真正加载补丁文件，这里等待其完成信号
    window.__KAOYAN_SCRIPTS = window.__KAOYAN_SCRIPTS || [];
    return (window.__KAOYAN_HARNESS_WAIT__ || Promise.resolve()).then(function(){
      var ids = Object.keys(window.__KAOYAN_PATCHES || {});
      return { ids: ids, requested: PATCH_IDS.length, loaded: ids.length };
    });
  }
  window.__KAOYAN_PATCHES = {};
  return new Promise(function(resolve){
    var i = 0, loaded = 0;
    var total = PATCH_IDS.length;
    (function next(){
      if(i >= total){ resolve({ ids: Object.keys(window.__KAOYAN_PATCHES), requested: total, loaded: loaded }); return; }
      var id = PATCH_IDS[i++];
      var s = document.createElement('script');
      var done = false;
      function finish(okFlag){
        if(done) return; done = true;
        if(okFlag) loaded++;
        if(s.parentNode) s.parentNode.removeChild(s);
        next();
      }
      s.src = 'data/patches/' + id + '.js?_p=' + Date.now();
      s.onload = function(){ finish(true); };
      s.onerror = function(){ finish(false); };   // 文件不存在时静默跳过
      document.head.appendChild(s);
      setTimeout(function(){ finish(false); }, 1200);    // 兜底，避免某个文件卡住整轮扫描
    })();
  });
}

/* 读不到 state.js 时的兜底：直接用 questions.js 的题库 */function initSeedFromBank(){
  Store.seed = {

  };

/* 数据加载：等 3 个数据脚本真正 onload 后再合并（固定 90ms 定时器会撞上磁盘慢/文件大，
   导致"题库 0 道题、提交记录消失"的偶发白屏，见 tools/validate.js 的渲染仿真之外的真机复现） */
var LOAD_TIMEOUT_MS = 8000;
function loadData(){
  return new Promise(function(resolve){
    // 串行化：并发调用会互相清空 __KAOYAN_STATE / __KAOYAN_PATCHES，导致互相读到半成品
    if(Store.loadingPromise){ Store.loadingPromise.then(function(){ resolve(); }); return; }
    var finished = false;
    var finishLoad;
    Store.loadingPromise = new Promise(function(res){ finishLoad = res; });
    Store.seed = { meta:{}, questions:[], completions:[] };
    window.__KAOYAN_QUESTIONS = [];
    window.__KAOYAN_STATE = null;
    window.__KAOYAN_PATCHES = {};
    window.__KAOYAN_BANK_ERRORS = [];
    var s0 = null, s1 = null, s2 = null;

    function cleanup(){
      [s0, s1, s2].forEach(function(s){ if(s && s.parentNode) s.parentNode.removeChild(s); });
    }

    function afterScripts(){
      if(finished) return;
      finished = true;
      var st = null;
      try { st = window.__KAOYAN_STATE; } catch(e){ Store.seedError = String(e.message || e); }
      if(st){
        // 题库合并：state.js 与 questions.js 的题目都收，按 id 去重（state.js 优先）。
        // 这样以后往 questions.js 追加真题/模拟题，页面不用改 state.js 就能看到。
        var bankList = window.__KAOYAN_QUESTIONS || [];
        var merged = {}, list = [];
        (st.questions || []).forEach(function(q){ if(q && q.id && !merged[q.id]){ merged[q.id] = 1; list.push(q); } });
        bankList.forEach(function(q){ if(q && q.id && !merged[q.id]){ merged[q.id] = 1; list.push(q); } });
        Store.seed = {
          meta: st.meta || {},
          questions: list,
          completions: st.completions || []
        };
        // 保护：题目文件若执行中断（例如引用了不存在的图函数），bankList 为空但文件里其实有题
        if(!bankList.length) Store.bankError = bankProbe();
        else Store.bankError = null;
        Store.syncNote = '数据已加载 · ' + fmtTime(new Date().toISOString());
      } else { initSeedFromBank(); if(!(window.__KAOYAN_QUESTIONS||[]).length) Store.bankError = bankProbe(); }
      if(!st) Store.syncNote = '⚠ 未能读取 data/state.js（正在用 data/questions.js 兜底）';
      cleanup();
      // 加载 AI 写回的批改补丁（JS 形式）；探测范围按已见到的编号动态生成
      rebuildPatchIds();
      scanPatchFiles().then(function(res){
        var foundIds = (res && res.ids) || [];
        var mergedPatches = {};
        foundIds.forEach(function(id){ mergedPatches[id] = window.__KAOYAN_PATCHES[id]; });
        Store.patchFiles = foundIds;
        Store.patchLoad = { requested: (res && res.requested) || foundIds.length, loaded: (res && res.loaded) || foundIds.length };
        // 一个补丁都没读到、但上次明明有补丁 → 多半是 script 全被拦截/中途失败，
        // 这时保留上次会话缓存，避免整页批改结果凭空消失。
        if(!foundIds.length && Object.keys(Store.patches || {}).length && !(res && res.loaded)){
          Store.syncNote = '⚠ 未能读取 data/patches/（仍然显示上次会话缓存的结果）';
        } else {
          Store.patches = mergedPatches;
          saveLS(LS_PATCH, Store.patches);
        }
        if(!Store.patchFiles.length && !st){
          Store.syncNote = '⚠ 未读到 state.js，也未发现任何批改补丁';
        } else if(Store.patchFiles.length){
          Store.syncNote = '数据已加载 · 补丁 ' + Store.patchFiles.length + ' 个 · ' + fmtTime(new Date().toISOString());
        }
        notePatchConflicts();          // 编号撞车检查（有冲突时覆盖上面的状态文字）
        Store.lastLoad = new Date();
        if(finishLoad) finishLoad();
        Store.loadingPromise = null;
        renderMeta();
        render();
        if(window.__KAOYAN_DIAG) window.__KAOYAN_DIAG.ready = true;
        resolve();
      });
    }

    // 每次重新加载都用带时间戳的新 script 标签，绕过 file:// 缓存
    s0 = injectScript('data/figures.js', null, function(){});   // 公用示意图库（须先于题库）
    s1 = injectScript('data/questions.js', null, function(){}); // 题目文件执行失败时不会中断本页
    s2 = injectScript('data/state.js', null, function(){});
    // 三个脚本都 onload（或超时兜底）后再合并数据
    waitScriptsLoaded([s0, s1, s2], afterScripts, LOAD_TIMEOUT_MS);
  });
}

/* 等一组 <script> 加载完成。
   仿真模式（__KAOYAN_HARNESS__）下 injectScript 只登记脚本、由自检脚本读磁盘同步执行，
   所以这里要等它的完成信号 __KAOYAN_HARNESS_WAIT__，否则会在数据还没执行时就去合并。 */
function waitScriptsLoaded(list, done, timeoutMs){
  if(window.__KAOYAN_HARNESS__){
    var w = window.__KAOYAN_HARNESS_WAIT__;
    if(w && typeof w.then === 'function'){ w.then(function(){ done(); }); }
    else { setTimeout(done, 0); }   // 仿真脚本稍后才挂上完成信号，等它一轮
    return;
  }
  var left = 0, fired = false;
  function one(){ if(fired) return; left--; if(left <= 0){ fired = true; done(); } }
  list.forEach(function(s){
    if(!s){ return; }
    left++;
    s.addEventListener('load', one);
    s.addEventListener('error', one);
  });
  setTimeout(function(){ if(!fired){ fired = true; done(); } }, timeoutMs || LOAD_TIMEOUT_MS);
  if(left === 0){ fired = true; done(); }
}

/* ---------------- 数据合并 ---------------- */
function questionById(id){
  var q = Store.seed.questions.filter(function(x){ return x.id === id; })[0];
  if(q) return q;
  var mine = mineQuestions().filter(function(x){ return x.id === id; })[0];
  if(mine) return mine;
  var c = allCompletions(true).filter(function(x){ return x.id === id; })[0];
  return c ? { id:id, title:'（自定义题目）', kind:'major' } : { id:id, title:'（题目已删除）', kind:'major' };
}

/* ---------------- 题目分类与练习轨迹 ---------------- */
function allQuestions(){
  var out = Store.seed.questions.slice();
  var seen = {};
  out.forEach(function(q){ seen[q.id] = 1; });
  mineQuestions().forEach(function(q){ if(!seen[q.id]){ seen[q.id] = 1; out.push(q); } });
  return out;
}
function mineQuestions(){
  return (loadLS(LS_MINEQ, []) || []).map(function(q){
    if(!q.category) q.category = 'mine';
    return q;
  });
}
function attemptsOf(qid){
  return allCompletions(true).filter(function(c){ return c.questionId === qid; });
}
/* 同一篇作文的改稿链：靠 revises（改稿指向）与 draftGroup（同一稿组）双线索串起来 */
function revisionChain(c){
  var all = allCompletions(true);
  var byId = {};
  all.forEach(function(x){ byId[x.id] = x; });
  var node = byId[c.id];
  if(!node) return [c];

  // 找稿组 id：自己带的，或顺着 revises 向上找到第一个带 draftGroup 的祖先
  var gid = node.draftGroup || null;
  if(!gid){
    var up = node, guard0 = 0;
    while(up && !gid && guard0++ < 50){
      if(up.draftGroup) gid = up.draftGroup;
      up = up.revises ? byId[up.revises] : null;
    }
  }
  if(!gid) gid = node.revises || node.id;        // 老数据没有稿组时，用链首 id 当组标识

  // 组成员：组首本身、组内成员、直接改稿、以及"改稿的改稿"
  var members = all.filter(function(x){
    if(x.id === gid) return true;
    if(x.draftGroup === gid) return true;
    if(x.revises === gid) return true;
    return all.some(function(y){ return y.id === x.revises && (y.id === gid || y.draftGroup === gid); });
  });
  members.sort(function(a,b){
    var na = a.draftNo || (a.id === gid ? 1 : 0), nb = b.draftNo || (b.id === gid ? 1 : 0);
    if(na !== nb) return na - nb;
    return String(a.submittedAt).localeCompare(String(b.submittedAt));
  });
  if(members.length >= 2) return members;
  if(!isRevision(node)) return [node];           // 确实是独立一篇
  return members.length ? members : [node];
}
/* 与某篇有关联的所有稿件（含"后来在这个问题上再练"的独立篇） */
function relatedChain(c){
  var chain = revisionChain(c);
  var seen = {};
  chain.forEach(function(x){ seen[x.id] = 1; });
  var frontier = chain.slice();
  var guard = 0;
  while(frontier.length && guard++ < 200){
    var cur = frontier.shift();
    var kids = allCompletions(true).filter(function(x){
      return x.revises === cur.id && !seen[x.id] && (seen[x.id] = 1);
    });
    kids.forEach(function(k){ chain.push(k); frontier.push(k); });
  }
  chain.sort(function(a,b){ return String(a.submittedAt).localeCompare(String(b.submittedAt)); });
  return chain;
}
function draftNoOf(c){ return c.draftNo || null; }
function isRevision(c){ return !!(c.revises || c.draftNo); }
function isSameQuestion(prev, cur){
  if(!prev || !cur) return false;
  if(prev.questionId !== cur.questionId) return false;
  if(prev.ownPrompt && cur.ownPrompt) return similarity(prev.ownPrompt, cur.ownPrompt) >= 0.4;
  return true;
}
function chainLabel(c){
  var ch = revisionChain(c);
  if(ch.length < 2) return '';
  for(var i=0;i<ch.length;i++){ if(ch[i].id === c.id) return '第 ' + (i+1) + ' 稿'; }
  return '';
}
function practiceStats(qid){
  var list = attemptsOf(qid);
  var graded = list.filter(function(c){ return c.status === 'graded' && c.grading; });
  var rates = graded.map(rateOf).filter(function(r){ return r != null; });
  var avg = rates.length ? rates.reduce(function(a,b){ return a+b; },0)/rates.length : null;
  var best = rates.length ? Math.max.apply(null, rates) : null;
  var last = list.length ? list[0] : null;
  return { total:list.length, graded:graded.length, pending:list.length-graded.length,
           avg:avg, best:best, last:last, list:list };
}
function practiceBadge(qid){
  var s = practiceStats(qid);
  if(!s.total) return '<span class="pill flat">未练习</span>';
  return '<span class="pill done">已练 ' + s.total + ' 次</span>' +
         (s.pending ? '<span class="pill pending">待批改 ' + s.pending + '</span>' : '') +
         (s.avg != null ? '<span class="pill">均分率 ' + pct(s.avg) + '</span>' : '');
}
function practicePanel(q){
  var s = practiceStats(q.id);
  var h = '<div class="practice"><div class="ptitle">练习与改稿记录　' + practiceBadge(q.id) + '</div>';
  if(!s.total){
    h += '<div class="hint" style="margin:6px 0 0">这道题还没有练习记录。</div></div>';
    return h;
  }
  h += '<div class="kv" style="margin:6px 0 8px">累计 <b>' + s.total + '</b> 次提交' +
       (s.graded ? '，已批改 <b>' + s.graded + '</b> 次' : '') +
       (s.avg != null ? '，平均得分率 <b>' + pct(s.avg) + '</b>' : '') +
       (s.best != null ? '，最好 <b>' + pct(s.best) + '</b>' : '') + '</div>';
  h += '<table class="pttable"><thead><tr><th>提交</th><th>稿次</th><th>时间</th><th class="c">得分</th><th class="c">状态</th><th class="c">操作</th></tr></thead><tbody>';
  s.list.forEach(function(c){
    var sc = (c.status==='graded' && c.grading) ? (c.grading.score + ' / ' + c.grading.fullScore) : '—';
    var lbl = chainLabel(c);
    h += '<tr><td class="mono">' + esc(c.id) + '</td>'
       + '<td>' + (lbl ? '<b>' + esc(lbl) + '</b>' : (isRevision(c) ? '改稿' : '<span class="isub">独立一篇</span>')) + '</td>'
       + '<td>' + fmtTime(c.submittedAt) + '</td>'
       + '<td class="c">' + esc(sc) + '</td>'
       + '<td class="c">' + (c.status==='graded' ? '<span class="pill graded">已批改</span>' : '<span class="pill pending">待批改</span>') + '</td>'
       + '<td class="c"><button class="btn ghost" data-open-sub="' + esc(c.id) + '">看批改</button>'
       + ' <button class="btn ghost" data-revisions="' + esc(c.id) + '">对比</button></td></tr>';
  });
  h += '</tbody></table>';
  // 同一篇作文的改稿链 → 一键总览 / 对比
  var chains = [];
  s.list.forEach(function(c){
    if(!isRevision(c)) return;
    var ch = revisionChain(c);
    if(ch.length < 2) return;
    var head = ch[0].id;
    if(!chains.some(function(g){ return g.head === head; })) chains.push({ head:head, list:ch });
  });
  if(chains.length){
    h += '<div class="note" style="margin-top:10px"><b>同一篇作文的改稿链</b>'
       + '<div class="hint" style="margin-top:4px">点「总览对比」可以把这条链上的每一稿并排看：分数变化、当时的问题、哪些问题改了、哪些还在。</div>';
    chains.forEach(function(g){
      var first = g.list[0];
      h += '<div class="row" style="margin-top:8px">'
         + '<span class="pill done">' + g.list.length + ' 稿</span>'
         + '<span class="mono">' + g.list.map(function(x){ return x.id; }).join(' → ') + '</span>'
         + '<button class="btn primary" data-revisions="' + esc(first.id) + '">总览对比（' + g.list.length + ' 稿）</button>'
         + '<span class="isub">' + (first.grading ? ('首稿 ' + first.grading.score + '/' + first.grading.fullScore) : '首稿待批改') + '</span></div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* 同一篇作文所有稿件的并排对比 */
function revisionsView(anchorId){

        + (chain.length < 2 ? '目前这里只有 1 稿；在提交页把新一篇标为「修改稿」后，两稿就会并排出现在这里。' : '')

       + '</div>';
  } else if(done.length === 1){

  });
  h += '</tr></thead><tbody>';

    h += '<td class="cmpcell"><div class="cmpessay">' + esc(c.essayText || '（无文字内容）').replace(/\n/g,'<br>') + '</div>'

  });

     + '<div class="hint" style="margin-top:8px">「已解决 / 仍然存在」是按问题描述的关键词自动比对的，供参考；以每稿的【必须修改】清单为准。</div>'
     + '</div>';

}
function notePending(c){ return !(c.status === 'graded' && c.grading); }
function shorten(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function overlapKeywords(a, b){
  var ta = normTokens(a), tb = normTokens(b);
  if(!ta.length || !tb.length) return false;
  var set = {}; tb.forEach(function(w){ set[w] = 1; });
  var hit = ta.filter(function(w){ return set[w]; }).length;
  return hit / ta.length >= 0.34;
}

/* ---------------- 题目重复识别 ---------------- */
var STOP_EN = { the:1,a:1,an:1,and:1,or:1,of:1,to:1,in:1,on:1,for:1,with:1,you:1,your:1,write:1,essay:1,words:1,
                should:1,your:1,about:1,that:1,this:1,is:1,are:1,be:1,it:1,as:1,at:1,by:1,from:1,drawing:1,
                following:1,describe:1,explain:1,give:1,comments:1,briefly:1,intended:1,meaning:1,paragraph:1,
                letter:1,email:1,notice:1,suppose:1,university:1,students:1,student:1,do:1,not:1,use:1,own:1,name:1,
                instead:1,points:1,words:1,answer:1,sheet:1,neatly:1,write:1,please:1,translate:1,chinese:1 };
function normTokens(s){
  var t = String(s || '').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, ' ').trim();
  if(!t) return [];
  var out = [];
  // 英文/数字：按词，过滤停用词与纯数字
  t.replace(/[a-z][a-z0-9]*|\d+/g, function(w){
    if(/^\d+$/.test(w) || w.length < 2 || STOP_EN[w]) return '';
    out.push(w);
    return '';
  });
  // 中文：按字（中文没有词边界，按字才能反映"改写"的重叠度）
  t.replace(/[\u4e00-\u9fa5]+/g, function(run){
    for(var i = 0; i < run.length; i++) out.push(run.charAt(i));
    return '';
  });
  return out;
}
function bigrams(tokens){
  var set = {};
  for(var i=0;i<tokens.length-1;i++) set[tokens[i]+'|'+tokens[i+1]] = 1;
  return set;
}
function simComponent(aTokens, bTokens){
  if(aTokens.length < 4 || bTokens.length < 4) return 0;
  var A = {}, B = {};
  aTokens.forEach(function(w){ A[w] = 1; });
  bTokens.forEach(function(w){ B[w] = 1; });
  var ka = Object.keys(A), inter = 0, uni = {};
  ka.forEach(function(w){ uni[w] = 1; if(B[w]) inter++; });
  Object.keys(B).forEach(function(w){ uni[w] = 1; });
  var jac = inter / Object.keys(uni).length;
  var GA = bigrams(aTokens), GB = bigrams(bTokens);
  var gk = Object.keys(GA), gi = 0, gu = {};
  gk.forEach(function(g){ gu[g] = 1; if(GB[g]) gi++; });
  Object.keys(GB).forEach(function(g){ gu[g] = 1; });
  var dice = (gk.length + Object.keys(GB).length) ? (2*gi / (gk.length + Object.keys(GB).length)) : 0;
  // 覆盖率：a 中有多少比例的 token 能在 b 里找到（对"自带题目"这种短文本 + 长题库条目更敏感）
  var cover = 0, hit = 0;
  Object.keys(A).forEach(function(w){ if(B[w]) hit++; });
  cover = hit / ka.length;
  return { max: Math.max(jac, dice), cover: cover };
}
function similarity(a, b){
  var r = simComponent(normTokens(a), normTokens(b));
  return r.max;
}
/* 找相似题目：Jaccard/二元组相似度 或 覆盖率（自带题目较短时靠覆盖率兜底）
   注意：两侧都必须用经过停用词过滤的 token（normTokens），否则重叠率会被 and / the / write 这类词拉偏。 */
function findSimilarQuestions(text, topN){
  var mine = normTokens(text);
  var scored = allQuestions().map(function(q){
    var blob = [q.title, q.promptTextZh, q.promptZh, q.promptEn, q.passage].filter(Boolean).join(' \n ');
    var r = simComponent(mine, normTokens(blob));
    // 0.6×覆盖率 + 0.4×二元组相似度：既照顾"自带题目较短"，也照顾"改写同一道题"
    var score = 0.6 * r.cover + 0.4 * r.max;
    return { q:q, score: score, raw:r.max, cover:r.cover };
  }).filter(function(x){ return x.score >= 0.45; });   // 实测：无关题目 ≤0.40，同一道题的改写 ≥0.53
  scored.sort(function(a,b){
    if(Math.abs(b.score - a.score) > 0.02) return b.score - a.score;
    // 分数接近时优先归并到真题，其次模拟题
    var rank = { real:0, mock:1, mine:2 };
    var ra = rank[catOf(a.q)] == null ? 3 : rank[catOf(a.q)];
    var rb = rank[catOf(b.q)] == null ? 3 : rank[catOf(b.q)];
    if(ra !== rb) return ra - rb;
    return b.score - a.score;
  });
  return scored.slice(0, topN || 3);
}
/* 自动归并阈值：明显是同一道题时才自动挂到已有题下面
   实测校准（中文改写描述 vs 无关题目）：同一道题 0.53—0.81；无关题目 0.33—0.40。取 0.55。 */
function bestDuplicate(text){
  var hits = findSimilarQuestions(text, 1);
  if(!hits.length) return null;
  var h = hits[0];
  return (h.score >= 0.55) ? h : null;
}
function nextMineQuestionId(){
  var max = 0;
  mineQuestions().forEach(function(q){
    var m = /q_mine_(\d+)/.exec(q.id||''); if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'q_mine_' + ('00'+(max+1)).slice(-3);
}
function patchOf(id){ return Store.patches[id] || null; }

function applyPatch(c){
  var p = patchOf(c.id);
  if(!p) return c;
  /* 防「编号撞车」：批改补丁里带 questionId（AI 写补丁时必填）。
     如果补丁的题目与这条提交的题目对不上，说明这个 sub_XXXX.js 是别人的结果
     （例如另一个浏览器、另一台电脑、或自检脚本用了同一个编号），此时**不套用**，
     只做标记，页面会把这条继续显示为「待批改」，并在顶栏给出提示。 */
  if(p.questionId && c.questionId && String(p.questionId) !== String(c.questionId)){
    var mism = {};
    for(var k0 in c) mism[k0] = c[k0];
    mism.patchMismatch = String(p.questionId);
    return mism;
  }
  var merged = {};
  for(var k in c) merged[k] = c[k];
  if(p.status) merged.status = p.status;
  if(p.gradedAt) merged.gradedAt = p.gradedAt;
  if(p.grading) merged.grading = p.grading;
  return merged;
}
/* 有哪些提交的补丁与题目对不上（编号撞车） */
function patchConflictIds(){
  var out = [];
  allCompletions(true).forEach(function(c){ if(c.patchMismatch) out.push(c.id); });
  return out;
}
/* 把冲突写进顶栏状态；返回冲突编号数组 */
function notePatchConflicts(){
  var ids = patchConflictIds();
  Store.patchConflicts = ids;
  if(ids.length){
    Store.syncNote = '⚠ ' + ids.join('、') + '：批改补丁的题目与这条提交不一致，已忽略该结果（疑似编号撞车，请检查 data/patches/ 并重新批改）';
  }
  return ids;
}
function allCompletions(includeGraded){
  var out = [], seen = {};
  function push(c){
    if(!c || !c.id || seen[c.id]) return;
    seen[c.id] = 1; out.push(applyPatch(c));
  }
  Store.subs.forEach(push);
  Store.seed.completions.forEach(push);
  // 只有补丁、没有原始提交的情况（例如提交只存在别的浏览器里）
  Object.keys(Store.patches).forEach(function(id){
    if(seen[id]) return;
    var p = Store.patches[id];
    push({ id:id, questionId:p.questionId||'', submittedAt:p.gradedAt||'', status:'graded',
           essayText:p.essayText||'', note:'', imagePath:'' });
  });
  out.sort(function(a,b){
    var ta = parseTime(a.submittedAt), tb = parseTime(b.submittedAt);
    if(ta && tb) return tb - ta;
    return String(b.id).localeCompare(String(a.id));
  });
  if(!includeGraded) out = out.filter(function(c){ return c.status !== 'graded'; });
  return out;
}
function gradedList(){
  return allCompletions(true).filter(function(c){ return c.status === 'graded' && c.grading; });
}
function pendingList(){
  return allCompletions(true).filter(function(c){ return c.status !== 'graded'; });
}

/* ---------------- 统计 ---------------- */
function stats(){
  var g = gradedList();
  var rateSum = 0, n = 0;
  g.forEach(function(c){
    var s = num(c.grading.score), f = num(c.grading.fullScore);
    if(s!=null && f){ rateSum += s/f; n++; }
  });
  return {
    submitted: allCompletions(true).length,
    graded: g.length,
    pending: pendingList().length,
    avgRate: n ? rateSum/n : null
  };
}
function scoreOf(c){ return num(c.grading && c.grading.score); }
function fullOf(c){ return num(c.grading && c.grading.fullScore, 0) || 0; }
function rateOf(c){ var f = fullOf(c); return f ? scoreOf(c)/f : null; }

/* ---------------- 错题/语言点聚合 ---------------- */
var CAT_RULES = [
  { name:'主谓一致', kw:['主谓一致','第三人称单数','谓语单复数','单数三连','the number of','each of','neither of'] },
  { name:'时态与语态', kw:['时态','进行时','完成时','被动','语态','tense'] },
  { name:'名词与冠词', kw:['冠词','可数','不可数','名词','单复数','article','countab','a / an','复数'] },
  { name:'词性与搭配', kw:['词性','搭配','collocation','介词误用','形容词','副词','短语动词'] },
  { name:'从句与句法', kw:['定语从句','关系词','从句','倒装','平行结构','非谓语','悬垂','语序','强调句'] },
  { name:'代词与指代', kw:['指代','pronoun','代词','指谁','还原'] },
  { name:'拼写与标点', kw:['拼写','标点','错别字','大小写'] },
  { name:'内容与审题', kw:['审题','偏题','要点','漏译','完整性','切题','内容点'] },
  { name:'结构与衔接', kw:['衔接','连贯','过渡','段落','结构','层次'] },
  { name:'其他', kw:[] }
];
function categorize(text){
  var t = String(text||'').toLowerCase();
  for(var i=0;i<CAT_RULES.length;i++){
    var r = CAT_RULES[i];
    for(var j=0;j<r.kw.length;j++){
      if(t.indexOf(String(r.kw[j]).toLowerCase()) >= 0) return r.name;
    }
  }
  return '其他';
}
function mistakeEntries(){
  var out = [];
  gradedList().forEach(function(c){
    var g = c.grading, q = questionById(c.questionId);
    (g.sentenceNotes||[]).forEach(function(sn, idx){
      if(sn.level === 'must' || sn.level === 'optional'){
        var blob = (sn.issue||'') + ' ' + (sn.explain||'');
        out.push({
          key: c.id + '#' + idx, subId: c.id, when: c.gradedAt || c.submittedAt,
          qTitle: q.title, kind: q.kind, level: sn.level,
          cat: categorize(blob), original: sn.original||'', issue: sn.issue||'',
          revised: sn.revised||'', explain: sn.explain||''
        });
      }
    });
    (g.sentences||[]).forEach(function(s, idx){
      (s.errors||[]).forEach(function(e, j){
        out.push({
          key: c.id + '#s' + idx + '-' + j, subId: c.id, when: c.gradedAt || c.submittedAt,
          qTitle: q.title, kind: q.kind, level:'must',
          cat: categorize(e), original: s.original||'', issue: e, revised: s.revised||'', explain:''
        });
      });
    });
    ((g.review && g.review.priority) || []).forEach(function(p, idx){
      out.push({
        key: c.id + '#p' + idx, subId: c.id, when: c.gradedAt || c.submittedAt,
        qTitle: q.title, kind: q.kind, level:'priority',
        cat: categorize(p), original:'', issue:p, revised:'', explain:''
      });
    });
  });
  out.sort(function(a,b){
    var ta = parseTime(a.when), tb = parseTime(b.when);
    return (tb&&ta) ? tb-ta : 0;
  });
  return out;
}
function expressionEntries(){
  var out = [];
  gradedList().forEach(function(c){
    var q = questionById(c.questionId);
    ((c.grading && c.grading.expressions) || []).forEach(function(e){
      out.push({ subId:c.id, when:c.gradedAt||c.submittedAt, qTitle:q.title, phrase:e.phrase||'', meaning:e.meaning||'', usage:e.usage||'' });
    });
  });
  return out;
}

/* ---------------- 高亮原句错误 ---------------- */
function buildMarkMap(c){
  var map = [], notes = (c.grading && c.grading.sentenceNotes) || [];
  notes.forEach(function(sn){
    if(!sn.original) return;
    var frag = String(sn.original).trim();
    // 若批改给出的"原句"与作文不同（例如译文），尝试取其前 6 个词做锚点
    map.push({ find: frag, level: sn.level || 'must', issue: sn.issue || '', revised: sn.revised || '' });
    var words = frag.split(/\s+/);
    if(words.length > 5){
      map.push({ find: words.slice(0,5).join(' '), level: sn.level || 'must', issue: sn.issue || '', revised: sn.revised || '' });
    }
  });
  map.sort(function(a,b){ return b.find.length - a.find.length; });
  return map;
}
function renderEssayMarked(text, grade){
  var raw = String(text||'');
  if(!Store.markingOn || !grade) return '<div class="essay">' + nl2br(raw) + '</div>';
  var map = buildMarkMap({ grading: grade });
  if(!map.length) return '<div class="essay">' + nl2br(raw) + '</div>';
  var parts = [{ t:'text', v:raw }];
  map.forEach(function(m){
    var next = [];
    parts.forEach(function(p){
      if(p.t !== 'text' || !m.find || p.v.indexOf(m.find) < 0){ next.push(p); return; }
      var i = p.v.indexOf(m.find);
      if(i > 0) next.push({ t:'text', v:p.v.slice(0,i) });
      next.push({ t:'mark', v:p.v.slice(i, i+m.find.length), level:m.level, issue:m.issue, revised:m.revised });
      var rest = p.v.slice(i+m.find.length);
      if(rest) next.push({ t:'text', v:rest });
    });
    parts = next;
  });
  return '<div class="essay">' + parts.map(function(p){
    if(p.t === 'text') return nl2br(p.v);
    var tip = (p.level === 'ok' ? '可保留' : (p.level === 'optional' ? '【可选优化】' : '【必须修改】')) + ' ' + (p.issue || '') + (p.revised ? ' → ' + p.revised : '');
    return '<mark class="err ' + esc(p.level) + '" title="' + esc(tip) + '">' + esc(p.v) + '</mark>';
  }).join('') + '</div>';
}

/* ---------------- 渲染：总览 ---------------- */
function renderBoard(){

  var topCat = {};
  ents.forEach(function(e){ topCat[e.cat] = (topCat[e.cat]||0)+1; });
  var catRank = Object.keys(topCat).sort(function(a,b){ return topCat[b]-topCat[a]; }).slice(0,5);

  var html = '';
  html += '<div class="grid g4" style="margin-top:18px">';
  html += statCard('累计提交', st.submitted+' <small>篇</small>', '含大作文 / 小作文 / 翻译');
  html += statCard('AI 已批改', st.graded+' <small>篇</small>', st.pending ? ('还有 '+st.pending+' 篇待批改') : '暂无待批改');
  html += statCard('平均得分率', pct(st.avgRate), '只统计已批改的正式题目');
  html += statCard('最高分', (function(){
        var best = null; g.forEach(function(c){ if(rateOf(c)!=null && (best==null || rateOf(c)>best)) best = rateOf(c); });
        return best==null ? '—' : pct(best);
      })(), '按得分率排序');
  html += '</div>';

    html += '<div class="card"><h2>待批改（'+pend.length+'）</h2><div class="hint">这些作文已提交，等待 AI 批改。回到对话里对我说一句「<b>批改待批改作文</b>」即可。</div>';
    pend.forEach(function(c){ html += submissionItem(c, false); });
    html += '</div>';
  }

  html += '<div class="card"><h2>最近批改</h2><div class="hint">点击条目展开完整批改内容。</div>';
  if(!recent.length){ html += '<div class="empty">还没有批改结果。先到「提交作文」写一篇，再让 AI 批改。</div>'; }
  recent.forEach(function(c){ html += submissionItem(c, true); });
  html += '</div>';

  html += '<div class="grid g2" style="margin-top:0">';
  // 题库练习进度（分三类）
  var Q = allQuestions(), doneQ = 0, byCat = { real:[0,0], mock:[0,0], mine:[0,0] };
  Q.forEach(function(q){
    var c = catOf(q), practiced = practiceStats(q.id).total > 0;
    byCat[c][1]++; if(practiced){ byCat[c][0]++; doneQ++; }
  });
  html += '<div class="card"><h2>题库练习进度</h2><div class="hint">按三类统计：已练习 / 总题数。</div>'
       +  '<table class="pttable"><thead><tr><th>类别</th><th class="c">已练</th><th class="c">总题数</th><th class="c">进度</th></tr></thead><tbody>';
  ['real','mock','mine'].forEach(function(c){
    var d = byCat[c];
    html += '<tr><td>' + CAT_LABEL[c] + '</td><td class="c">' + d[0] + '</td><td class="c">' + d[1] + '</td>'
         +  '<td class="c">' + (d[1] ? Math.round(d[0]/d[1]*100) + '%' : '—') + '</td></tr>';
  });
  html += '</tbody></table><div class="kv" style="margin-top:8px">合计已练习 <b>' + doneQ + '</b> / ' + Q.length + ' 道'
       +  '<button class="btn ghost" style="margin-left:10px" data-view-link="bank">去题库 →</button></div></div>';

  html += '<div class="card"><h2>当前最需要治的问题</h2><div class="hint">按【必须修改】条目的出现频次自动聚合。</div>';
  if(!catRank.length){ html += '<div class="empty">暂无数据</div>'; }
  else{
    html += '<ul class="tight">';
    catRank.forEach(function(c){ html += '<li><b>'+esc(c)+'</b> —— 出现 '+topCat[c]+' 次</li>'; });
    html += '</ul><div class="hint" style="margin-top:10px">到「错题与语言点库」可以看到每条的具体原句与改法。</div>';
  }
  html += '</div>';
  html += '</div>';

  html += '<div class="card"><h2>快速开始</h2><ol class="tight" style="font-size:14px">'
       +  '<li>到「题库」按 <b>考研真题 / 模拟题 / 我的题目</b> 三类挑一道；点开可以看到<b>练过几次、每次的作文与得分</b>。</li>'
       +  '<li>在「提交作文」里粘贴作文正文（同一道题可以反复练，记录会累加在同一道题下面）。</li>'
       +  '<li>手里有别的题目？用「提交作文 → <b>上传自己的题目</b>」，把题目和作文一起交；若与真题/模拟题重复，会自动归并到那道题下面。</li>'
       +  '<li>回到对话说「批改待批改作文」，AI 会逐句批改并写回本页；手写照片先存到 <span class="mono">data/uploads/</span> 再填文件名。</li>'
       +  '<li>本页每 8 秒自动检查一次，也可以点右上角「重新加载数据」。</li></ol>'
       +  '<div class="note" style="margin-top:12px">批改结果由 AI 写成 <span class="mono">data/patches/sub_xxxx.js</span>；本页刷新后自动合并显示。</div>'
       +  '</div>';
  el.innerHTML = html;
  bindItems(el);
}
function statCard(k,v,f){

/* ---------------- 渲染：提交列表项 ---------------- */
function pillFor(c){
  var p = c.status === 'graded' ? '<span class="pill graded">已批改</span>' : '<span class="pill pending">待批改</span>';
  var q = questionById(c.questionId);
  var k = '<span class="pill '+KIND_CLASS[q.kind]+'">'+esc(kindLabel(q))+'</span>';
  return k + ' ' + p;
}
function submissionItem(c, openByDefault){
  var q = questionById(c.questionId);
  var isOpen = Store.open[c.id] === undefined ? !!openByDefault : !!Store.open[c.id];
  var rate = rateOf(c);
  var head = '<div class="ihead" data-toggle="'+esc(c.id)+'">'
    + '<span class="caret">'+(isOpen?'▾':'▸')+'</span>'
    + '<span class="ititle">'+esc(q.title)+'</span>'
    + pillFor(c)
    + (rate!=null ? '<span class="score">'+scoreOf(c)+' / '+fullOf(c)+' <span style="color:var(--ink3);font-weight:400">('+pct(rate)+')</span></span>' : '')
    + '<span class="spacer"></span>'
    + '<span class="isub">'+esc(c.id)+' · 提交 '+fmtTime(c.submittedAt)+'</span>'
    + '</div>';
  var body = '';
  if(isOpen){
    body = '<div class="ibody">' + renderSubmissionDetail(c, q) + '</div>';
  }
  return '<div class="item" data-id="'+esc(c.id)+'">'+head+body+'</div>';
}
function bindItems(root){
  root.querySelectorAll('[data-toggle]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-toggle');
      Store.open[id] = !(Store.open[id] === undefined ? false : Store.open[id]);
      render();
    });
  });
  root.querySelectorAll('[data-cat]').forEach(function(el){
    el.addEventListener('click', function(){
      var k = el.getAttribute('data-cat');
      Store.open['cat_'+k] = !Store.open['cat_'+k];
      render();
    });
  });
  root.querySelectorAll('[data-open-sub]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-open-sub');
      Store.open[id] = true; switchView('results');
    });
  });
  // 「总览对比」：同一篇作文的所有稿件并排看
  root.querySelectorAll('[data-revisions]').forEach(function(el){
    el.addEventListener('click', function(){
      Store.compare = el.getAttribute('data-revisions');
      switchView('results');
      toast('已打开改稿总览');
    });
  });
  root.querySelectorAll('[data-close-rev]').forEach(function(el){
    el.addEventListener('click', function(){ Store.compare = null; render(); });
  });
  // 「基于本稿改一版」：把这一稿填回提交页
  root.querySelectorAll('[data-edit-draft]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-edit-draft');
      var c = allCompletions(true).filter(function(x){ return x.id === id; })[0];
      if(!c){ toast('找不到这一稿'); return; }
      Store.draftQuestionId = c.questionId;
      Store.draftText = c.essayText || '';
      Store.prefillEdit = { revises:id, ownPrompt:c.ownPrompt || '' };
      saveLS(LS_META, { draftText:Store.draftText, draftQuestionId:Store.draftQuestionId, prefillEdit:Store.prefillEdit });
      switchView('submit');
      toast('已把 ' + id + ' 的内容填回提交页，改完直接提交（会作为修改稿挂在同一篇下面）');
    });
  });
}

/* 页面级「跳转」委托：只绑一次，避免重复绑定导致一次点击走多遍 */
function bindViewLinks(root){
  root = root || document;
  if(root.__viewLinksBound) return;
  root.__viewLinksBound = true;
  root.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-view-link]') : null;
    if(!t) return;
    e.preventDefault();
    switchView(t.getAttribute('data-view-link'));
  });
}

/* ---------------- 渲染：单条提交详情 ---------------- */
function renderSubmissionDetail(c, q){
  var h = '';
  var st = practiceStats(q.id);
  var nth = 0;
  st.list.forEach(function(x, i){ if(x.id === c.id) nth = i + 1; });
  // 题目
  h += '<details class="det" open><summary>题目：'+esc(q.title)+'　' + catPill(q)
     + '<span class="isub">'+esc(q.source||'')+'</span></summary><div>'
     +   renderQuestionBody(q, true)
     +   '<div class="hint" style="margin-top:8px">这道题累计练习 <b>'+st.total+'</b> 次，本篇是第 <b>'+nth+'</b> 次提交。'
     +   (st.total > 1 ? '全部 ' + st.total + ' 次记录见上方表格。' : '') + '</div>'
     + '</div></details>';
  // 我的作文 / 译文
  h += '<details class="det" open><summary>我的作文'+(c.imagePath?'（含手写照片）':'')+'</summary><div>';
  if(c.ownPrompt){
    h += '<div class="srcline"><b>我自己提供的题目原文：</b>' + nl2br(c.ownPrompt) + '</div>';
  }
  if(c.imagePath){
    h += '<div class="kv">手写照片：<span class="mono">'+esc(c.imagePath)+'</span>'
       + (Store.imgs[c.id] ? ' <button class="btn ghost" data-open-sub="'+esc(c.id)+'">（本机暂存预览见下）</button>' : '')
       + '</div>';
    if(Store.imgs[c.id]) h += '<img class="thumb" src="'+Store.imgs[c.id]+'" alt="手写作文照片">';
  }
  if(c.essayText){
    h += '<div class="row" style="margin-bottom:8px"><button class="btn ghost" data-mark="'+esc(c.id)+'">'
       + (Store.markingOn?'关闭':'开启')+'错误高亮</button>'
       + '<span class="isub">红色=必须修改　黄色=可选优化　绿色=可保留</span></div>';
    h += renderEssayMarked(c.essayText, c.grading);
  } else {
    h += '<div class="empty">（本篇没有文字内容，可能是照片提交）</div>';
  }
  if(c.note) h += '<div class="note warn" style="margin-top:10px">我的附加要求：'+esc(c.note)+'</div>';
  h += '</div></details>';

  if(c.status !== 'graded' || !c.grading){
    h += '<div class="note">等待批改：回到对话里对我说「<b>批改待批改作文</b>」（或指定「批改 '+esc(c.id)+'」）。</div>';
    return h;
  }
  h += renderGrading(c.grading, c);
  return h;
}

function renderGrading(g, c){
  var h = '';
  var rate = (num(g.fullScore) ? num(g.score)/num(g.fullScore) : null);
  h += '<div class="card" style="margin-top:14px;background:#fdfbf6"><h2>AI 批改结果</h2>'
     + '<div class="row" style="margin:6px 0 12px">'
     + '<span class="score big">'+ (num(g.score)==null?'—':g.score) +'</span>'
     + '<span class="kv">/ '+ (g.fullScore==null?'—':g.fullScore) +' 分'
     + (rate!=null ? '（得分率 '+pct(rate)+'）' : '') + '</span>'
     + '<span class="pill">'+esc(g.band||'')+'</span>'
     + (g.wordCount ? '<span class="pill">原文 '+g.wordCount+' 词</span>' : '')
     + (g.revisedWordCount ? '<span class="pill">改后 '+g.revisedWordCount+' 词</span>' : '')
     + '<span class="spacer"></span><span class="isub">批改时间 '+fmtTime(c.gradedAt)+'</span>'
     + '</div>';
  if(g.wordCountNote) h += '<div class="kv" style="margin-bottom:8px">词数核查：'+esc(g.wordCountNote)+'</div>';
  if(g.summary) h += '<div class="essay" style="font-family:inherit;font-size:14.5px;line-height:1.85">'+rich(g.summary)+'</div>';

  if((g.dimensions||[]).length){
    h += '<h3 style="font-size:15px;margin:16px 0 4px">分项评价</h3>';
    g.dimensions.forEach(function(d){
      h += '<div class="dim"><div><b>'+esc(d.name)+'</b><br><span class="isub">'+esc(d.level||'')+'</span></div><div>'+rich(d.comment||'')+'</div></div>';
    });
  }
  if(g.structureNotes){
    h += '<h3 style="font-size:15px;margin:16px 0 4px">句子主干与结构图解</h3>'
       + '<div class="essay mono" style="font-family:\'Cascadia Mono\',Consolas,monospace;font-size:13.5px;line-height:1.8">'+esc(g.structureNotes)+'</div>';
  }
  /* 逐句批改 */
  var notes = g.sentenceNotes || [];
  if(notes.length){
    var must = notes.filter(function(n){ return n.level==='must'; });
    h += '<h3 style="font-size:15px;margin:18px 0 6px">逐句批改　<span class="isub">'+notes.length+' 句　'
       + '<span class="pill must">必须修改 '+must.length+'</span> '
       + '<span class="pill optional">可选优化 '+notes.filter(function(n){return n.level==='optional';}).length+'</span> '
       + '<span class="pill ok">可保留 '+notes.filter(function(n){return n.level==='ok'||!n.level;}).length+'</span></span></h3>';
    h += '<ul class="notes">';
    notes.forEach(function(n){
      var lv = n.level || 'ok';
      var lbl = lv==='must' ? '【必须修改】' : (lv==='optional' ? '【可选优化】' : '【可保留】');
      h += '<li class="'+esc(lv)+'"><span class="pill '+esc(lv)+'">'+lbl+'</span> '
         + '<span class="lbl">我的原句</span><div class="orig">'+esc(n.original||'')+'</div>';
      if(n.issue) h += '<div style="margin-top:6px"><span class="lbl">问题</span>'+rich(n.issue)+'</div>';
      if(n.revised && n.revised !== n.original) h += '<div class="rev"><span class="lbl">修改句</span>'+rich(n.revised)+'</div>';
      if(n.explain) h += '<div class="exp" style="margin-top:8px">'+rich(n.explain)+'</div>';
      h += '</li>';
    });
    h += '</ul>';
  }
  /* 翻译逐句 */
  if((g.sentences||[]).length){
    var trq = questionById(c && c.questionId);
    var isEn2Trans = subjOf(trq) === 'en2';
    h += '<h3 style="font-size:15px;margin:18px 0 6px">逐句批改（翻译采分点）</h3>';
    g.sentences.forEach(function(s){
      var denom = (s.points && s.points.length)
        ? s.points.reduce(function(a,p){ return a + (num(p.score) || 0); }, 0)
        : (isEn2Trans ? '' : 2);
      h += '<div class="item" style="margin-bottom:12px"><div class="ihead" style="cursor:default">'
         + '<span class="ititle">第 '+esc(s.no||'')+' 句</span>'
         + '<span class="score">'+ (num(s.score)==null?'—':s.score) + (denom === '' ? '' : (' / ' + denom)) + '</span>'
         + '<span class="spacer"></span><span class="isub">'+(s.points?('采分点 '+s.points.length+' 个'):'')+'</span></div>'
         + '<div class="ibody" style="padding:12px 16px">'
         + '<div class="orig en" style="font-family:Georgia,serif;color:var(--ink2)">'+esc(s.original||'')+'</div>';
      if((s.points||[]).length){
        h += '<table class="pttable"><thead><tr><th>采分点（英文）</th><th>应表达的意思</th><th>分值</th><th>得分</th></tr></thead><tbody>';
        s.points.forEach(function(p){
          h += '<tr><td class="en">'+esc(p.en||'')+'</td><td>'+esc(p.meaning||'')+'</td>'
             + '<td class="c">'+esc(p.score==null?'':p.score)+'</td>'
             + '<td class="c" style="color:'+(num(p.got)>=num(p.score)?'var(--ok)':'var(--must)')+'">'+esc(p.got==null?'':p.got)+'</td></tr>';
        });
        h += '</tbody></table>';
      }
      if((s.errors||[]).length){
        h += '<div style="margin-top:6px"><span class="lbl">错误与结构分析</span><ul class="tight">';
        s.errors.forEach(function(e){ h += '<li>'+rich(e)+'</li>'; });
        h += '</ul></div>';
      }
      if(s.revised) h += '<div class="rev"><span class="lbl">修改译文</span>'+rich(s.revised)+'</div>';
      if(s.comment) h += '<div class="exp" style="margin-top:6px">'+rich(s.comment)+'</div>';
      h += '</div></div>';
    });
  }
  /* 修改后全文 */
  if(g.revisedEssay){
    h += '<h3 style="font-size:15px;margin:18px 0 6px">修改后全文　<span class="isub">加粗处为主要修改</span></h3>'
       + '<div class="essay rev">'+rich(g.revisedEssay)+'</div>';
  }
  /* 表达积累 */
  if((g.expressions||[]).length){
    h += '<h3 style="font-size:15px;margin:18px 0 6px">表达积累（考场可复现）</h3><ul class="notes">';
    g.expressions.forEach(function(e){
      h += '<li><div class="en" style="font-weight:600">'+esc(e.phrase||'')+'</div>'
         + '<div class="kv">'+esc(e.meaning||'')+'</div>'
         + '<div class="exp" style="font-size:13.5px">'+rich(e.usage||'')+'</div></li>';
    });
    h += '</ul>';
  }
  /* 复盘 */
  if(g.review){
    h += '<h3 style="font-size:15px;margin:18px 0 6px">复盘与下一步</h3>';
    if((g.review.priority||[]).length){
      h += '<div class="kv" style="margin-bottom:4px"><b>最需要优先改进的 '+g.review.priority.length+' 个问题</b></div><ol class="tight" style="font-size:14px">';
      g.review.priority.forEach(function(p){ h += '<li>'+rich(p)+'</li>'; });
      h += '</ol>';
    }
    if(g.review.framework){
      h += '<details class="det" style="margin-top:10px"><summary>写作/翻译框架与可替换句式</summary><div class="exp">'+rich(g.review.framework)+'</div></details>';
    }
  }
  /* 每次作文注意事项 */
  h += '<div class="note warn" style="margin-top:14px"><b>本篇注意事项（下次动笔前先看这三条）</b><ol class="tight" style="margin-top:6px">';
  var tips = [];
  var mustNotes = (g.sentenceNotes||[]).filter(function(n){ return n.level==='must'; });
  mustNotes.slice(0,3).forEach(function(n){ tips.push(esc(n.issue||'')); });
  ((g.review && g.review.priority) || []).forEach(function(p){ if(tips.length<3) tips.push(rich(p)); });
  if(!tips.length) tips.push('本篇没有发现必须修改的错误，保持当前的语言准确度，下一步可以尝试更丰富的论证细节。');
  tips.forEach(function(t){ h += '<li>'+t+'</li>'; });
  h += '</ol></div>';
  h += '</div>';
  return h;
}

/* ---------------- 渲染：题目 ---------------- */

     + subjPill(q)

     + '<span class="pill '+KIND_CLASS[q.kind]+'">'+esc(kindLabel(q))+'</span>'
     + (q.year?'<span class="pill">'+esc(q.year)+'</span>':'')
     + (q.words?'<span class="pill">字数 '+esc(q.words)+'</span>':'')
     + (q.difficulty?'<span class="pill">难度 '+'★'.repeat(Math.max(0,Math.min(5,q.difficulty)))+'</span>':'')
     + practiceBadge(q.id)
     + '</div></div></div>';
  h += '<div class="qbody'+(q.figure?' withfig':'')+'">';
  h += '<div>';

  if(q.promptZh) h += '<div class="zh" style="margin:10px 0"><b>题目要求（中文）：</b><br>'+nl2br(q.promptZh)+'</div>';
  if(q.promptEn) h += '<div class="prompt-en en">'+esc(q.promptEn)+'</div>';
  if(q.passage) h += '<div style="margin-top:10px"><div class="lbl">英文原文（划线句已编号）：</div><div class="essay en" style="font-size:15px;line-height:1.9">'+esc(q.passage)+'</div></div>';
  if((q.sentences||[]).length){
    h += '<div class="lbl" style="margin-top:10px">需要翻译/处理的句子：</div><ol class="sent-list">';
    q.sentences.forEach(function(x){ h += '<li>'+esc(x)+'</li>'; });
    h += '</ol>';
  }
  if((q.hints||[]).length){
    h += '<details class="det" style="margin-top:10px"><summary>写作/翻译提示（'+q.hints.length+' 条）</summary><ul class="tight">';
    q.hints.forEach(function(x){ h += '<li>'+esc(x)+'</li>'; });
    h += '</ul></details>';
  }
  if(!compact){
    h += '<div class="row" style="margin-top:12px"><button class="btn primary" data-pick="'+esc(q.id)+'">用这道题写一篇 →</button></div>';
  }
  h += '</div>';
  if(q.figure){
    h += '<div><div class="figurebox">'+q.figure+'<div class="cap">本站自绘示意图（非真题原图，真题原图请以试卷为准）</div></div></div>';
  }
  h += '</div>';
  // 练习轨迹：练过几次、每次的提交与得分
  h += practicePanel(q);
  return h;
}

function renderSubmit(){
  var el = $('#view-submit');
  var qs = allQuestions();
  var cur = Store.draftQuestionId || (qs[0] && qs[0].id) || '';
  var h = '';
  h += '<div class="card"><h2>提交一篇作文 / 译文</h2>'
     + '<div class="hint">写完提交后，回到对话里说「批改待批改作文」，AI 就会批改并写回本页。本页草稿自动保存在本机浏览器里，关掉再打开也不会丢。</div>'
     + '<label class="fld"><span>1. 选择题目（按科目与类别分组）</span><select id="sel-q">';
  ['en1','en2'].forEach(function(sj){

function nextSubId(){
  var max = 0;
  allCompletions(true).forEach(function(c){
    var m = /sub_(\d+)/.exec(c.id||''); if(m) max = Math.max(max, parseInt(m[1],10));
  });
  Object.keys(Store.patches).forEach(function(id){
    var m = /sub_(\d+)/.exec(id||''); if(m) max = Math.max(max, parseInt(m[1],10));
  });
  max = Math.max(max, Object.keys(Store.imgs).length);
  return 'sub_' + ('000'+(max+1)).slice(-4);
}
function doSubmit(text, qid, revisesId){
  var imgPath = $('#in-imgpath') ? $('#in-imgpath').value.trim() : '';
  // 手写照片也可以单独成篇（正文留空即可），与页面「手写稿可以跳过正文」的说明一致
  if((!text || !text.trim()) && !imgPath){ toast('请粘贴作文正文，或先选一张手写照片（两者交一种即可）'); return; }
  var id = nextSubId();
  var c = {
    id: id, questionId: qid, submittedAt: new Date().toISOString(), status: 'pending',
    essayText: text || '', note: $('#in-note') ? $('#in-note').value : '',
    imagePath: imgPath
  };
  // 改稿关系：标为某篇的修改稿 → 同一篇作文下可并排对比
  if(revisesId){
    var prev = allCompletions(true).filter(function(x){ return x.id === revisesId; })[0];
    if(prev && isSameQuestion(prev, c)){
      c.revises = prev.id;
      c.draftGroup = prev.draftGroup || prev.id;
      var sibs = allCompletions(true).filter(function(x){ return x.draftGroup === c.draftGroup || x.id === c.draftGroup; });
      var maxNo = 0;
      sibs.forEach(function(x){ if(x.draftNo) maxNo = Math.max(maxNo, x.draftNo); });
      c.draftNo = maxNo + 1;
    } else {
      toast('这一篇与所选上一篇不是同一道题，已按独立一篇记录');
    }
  }
  // 先落盘：写入失败（配额满 / 隐私模式）时不能假装成功，否则刷新即丢
  var prevImgs = Store.tmpImg ? Store.imgs[id] : undefined;
  if(Store.tmpImg){ Store.imgs[id] = Store.tmpImg; }
  Store.subs.push(c);
  var okSubs = saveLS(LS_SUBS, Store.subs);
  var okImgs = Store.tmpImg ? saveLS(LS_IMGS, Store.imgs) : true;
  if(!okSubs || !okImgs){
    Store.subs.pop();
    if(Store.tmpImg){ if(prevImgs === undefined) delete Store.imgs[id]; else Store.imgs[id] = prevImgs; }
    toast('提交失败：浏览器本地存储写不进去（可能已满或处于隐私模式）。请先在「错题与语言点库」导出备份，再清掉一些手写照片重试。');
    return;
  }
  Store.lastSubmit = id;
  Store.draftText = ''; Store.tmpImg = null; Store.tmpImgName = null; Store.prefillEdit = null;
  saveLS(LS_META, {draftText:'', draftQuestionId:qid, prefillEdit:null});
  toast('已提交 ' + id + (c.revises ? ('（' + revisesId + ' 的修改稿）') : '') + '。回到对话说「批改待批改作文」');
  syncSubmissionsToHelper(true);      // 服务在线就顺手同步，省得 AI 读不到
  render();
}

/* 上传自己的题目：题目 + 作文一起交 */
function doSubmitOwnQuestion(input){
  var promptText = (input.prompt || '').trim();
  var essay = (input.essay || '').trim();
  if(!promptText){ toast('请先粘贴题目原文（题目和作文要一起交）'); return; }
  if(!essay){ toast('还要粘贴你的作文正文——题目和作文要一起交给我'); return; }
  var qid = '';
  var autoMerged = null;
  if(input.mode === 'link' && input.linkId){
    qid = input.linkId;
  } else if(input.mode === 'new'){
    // 用户明确选了「这是一道新题」→ 尊重他的选择，只提示相似题，不擅自归并
    var maybe = bestDuplicate(promptText);
    if(maybe){
      autoMerged = maybe;
      toast('这道题与题库里的「'+maybe.q.title+'」有些相似，已按你的选择新建到「我的题目」；想归并的话请把下拉改成「和题库里已有的题重复」');
    }
  } else {
    // 二次判重：即使页面没提示，也再检查一次，避免重复建题
    var dup = bestDuplicate(promptText);
    if(dup){
      qid = dup.q.id;
      toast('与已有题目「'+dup.q.title+'」高度相似，已归并到那道题下面');
    }
  }
  if(!qid){
    qid = nextMineQuestionId();
    var mine = mineQuestions();
    mine.push({
      id: qid, category: 'mine', kind: input.kind || 'major',
      source: '我自己上传的题目', year: '我的题目',
      title: '我的题目：' + promptText.replace(/\s+/g,' ').slice(0, 26) + (promptText.length > 26 ? '…' : ''),
      promptZh: promptText, promptTextZh: promptText,
      words: (input.kind === 'minor' ? '100' : (input.kind === 'major' ? '160-200' : '')),
      tags: ['我的题目'], addedAt: new Date().toISOString()
    });
    saveLS(LS_MINEQ, mine);
  }
  var id = nextSubId();
  var c = {
    id: id, questionId: qid, submittedAt: new Date().toISOString(), status: 'pending',

  list.forEach(function(c){ h += '<div class="card" style="padding:0">'+submissionItem(c, true)+'</div>'; });

/* 把本机提交推送给本地辅助服务落盘（data/pending_submissions.json）。
   浏览器在 file:// 下无法自己写文件，这一步是"网页提交 → AI 能读到"的关键链路。 */
function syncSubmissionsToHelper(silent){
  if(typeof fetch !== 'function') return Promise.resolve(false);
  var payload = { completions: allCompletions(true) };
  var p = fetch(HELPER_URL + '/submissions', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload), cache:'no-store'
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j && j.ok){
      Store.syncedAt = new Date().toISOString();
      if(!silent) toast('本机提交已同步到服务（待批改 ' + (j.pending||[]).length + ' 篇）');
      return true;
    }
    if(!silent) toast('同步失败：' + ((j && j.error) || '未知原因'));
    return false;
  }).catch(function(e){ if(!silent) toast('同步失败：' + e.message); return false; });
  return p;
}

/* 题库文件"执行中断"探测：options 里出现语法错误/未定义函数时，整份文件会中断，
   于是 window.__KAOYAN_QUESTIONS 为空、页面上题目数为 0 —— 用真实文件内容做一次诊断 */
function bankProbe(){
  try{
    var req = (typeof XMLHttpRequest === 'function') ? new XMLHttpRequest() : null;
    if(!req) return null;
    req.open('GET', 'data/questions.js', false);      // 同步读，仅在数据加载阶段用一次
    req.send(null);
    var txt = req.responseText || '';
    var ids = (txt.match(/id:\s*'[^']+'/g) || []).length;
    if(ids < 3) return null;                          // 文件本身没题，不算错误
    var errs = (window.__KAOYAN_BANK_ERRORS && window.__KAOYAN_BANK_ERRORS.length)
      ? window.__KAOYAN_BANK_ERRORS[0] : null;
    return {
      ids: ids,
      message: errs || '题目文件执行中断（常见原因：题目里调用了图库里不存在的函数，如 F.xxx 未定义）'
    };
  }catch(e){ return null; }
}

/* ---------------- 题库一键更新（需要本地辅助服务） ----------------
   机制：网页把「要补哪些年份」发给本地服务 → 服务启动一次独立 agent →
   agent 联网核查最新真题、按格式补进 data/questions.js、跑自检 →
   网页检测到题库内容变化后自动重新加载。 */
function bankInfo(){
  var years = { en1: [], en2: [] };
  allQuestions().forEach(function(q){
    if(catOf(q) !== 'real') return;
    var m = /(\d{4})/.exec(String(q.year || ''));
    if(!m) return;
    var s = subjOf(q);
    if(years[s] && years[s].indexOf(parseInt(m[1], 10)) < 0) years[s].push(parseInt(m[1], 10));
  });
  var now = new Date().getFullYear();
  var BASELINE = 2010;
  function stat(arr){
    arr.sort(function(a, b){ return a - b; });
    var need = [];
    if(arr.length) for(var y = arr[arr.length-1] + 1; y <= now; y++) need.push(y);
    else for(var y2 = BASELINE; y2 <= now; y2++) need.push(y2);
    return { years: arr, min: arr[0] || null, max: arr[arr.length-1] || null, count: arr.length,
             need: need, empty: arr.length === 0, upToDate: need.length === 0 };
  }
  var en1 = stat(years.en1), en2 = stat(years.en2);
  var need = [];
  en1.need.concat(en2.need).forEach(function(y){ if(need.indexOf(y) < 0) need.push(y); });
  need.sort(function(a, b){ return a - b; });
  var mins = [en1.min, en2.min].filter(function(v){ return v != null; });
  var maxs = [en1.max, en2.max].filter(function(v){ return v != null; });
  return { nowYear: now, en1: en1, en2: en2, need: need, upToDate: en1.upToDate && en2.upToDate,
           min: mins.length ? Math.min.apply(null, mins) : null,
           max: maxs.length ? Math.max.apply(null, maxs) : null };
}
/* 题库指纹：用于检测 agent 更新完成 */
function bankFingerprint(){
  var qs = allQuestions().filter(function(q){ return catOf(q) === 'real'; });
  return 'real:' + qs.length + '|' + bankInfo().max + '|' + qs.map(function(q){ return q.id; }).sort().join(',');
}

  if(typeof fetch !== 'function'){ toast('这个浏览器不支持，请回 DSH 说一句「更新题库」'); return; }
  var info = bankInfo();

  }
  var btn = $('#btn-bank-update');

      if(!j.ok){ toast('未启动：' + (j.error || '未知原因')); render(); return; }
      Store.updateWatcher = { years: j.years, startedAt: Date.now(), fp: bankFingerprint() };
      toast('已启动题库更新：正在核查 ' + (j.years || []).join('、') + ' 年真题（需要几分钟）');

    });

function pollBankUpdate(){
  if(typeof fetch !== 'function') return;
  var tries = 0;
  var t = setInterval(function(){
    tries++;
    fetch(HELPER_URL + '/status', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.running){ if(tries % 20 === 1) toast('AI 正在联网核查并补题…（保持服务窗口开着）'); return; }
        clearInterval(t);
        var changed = Store.updateWatcher && Store.updateWatcher.fp !== bankFingerprint();
        Store.updateWatcher = null;
        toast(changed ? '题库已更新，正在重新加载' : '更新流程结束（是否补到题请看服务窗口输出）');
        render();
        if(changed){ Store.patches = {}; loadData().then(function(){ renderMeta(); render(); }); }
      })
      .catch(function(){ if(tries > 400) clearInterval(t); });
  }, 4000);
}
